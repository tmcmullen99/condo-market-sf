<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Condo Market SF</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f131d;
    color: #e8e3d8;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
    -webkit-font-smoothing: antialiased;
  }
  .card { max-width: 560px; text-align: center; }
  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #9fb4d8;
    margin-bottom: 24px;
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic; font-weight: 500;
    font-size: clamp(48px, 8vw, 80px);
    line-height: 1.02;
    margin-bottom: 22px;
    color: #e8e3d8;
  }
  h1 .accent { color: #9fb4d8; }
  p {
    font-size: 17px;
    color: rgba(232, 227, 216, 0.64);
    margin-bottom: 36px;
    max-width: 44ch;
    margin-left: auto;
    margin-right: auto;
  }
  .btn-row {
    display: flex; gap: 14px;
    justify-content: center; flex-wrap: wrap;
  }
  .btn {
    display: inline-block;
    padding: 13px 24px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 14px; font-weight: 500;
    text-decoration: none;
    transition: all 0.15s;
  }
  .btn-p { background: #9fb4d8; color: #1a1f2e; border: 1px solid #9fb4d8; }
  .btn-p:hover { opacity: 0.88; }
  .btn-s { background: transparent; color: #e8e3d8; border: 1px solid rgba(232, 227, 216, 0.22); }
  .btn-s:hover { border-color: #9fb4d8; color: #9fb4d8; }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">404 · Page not found</div>
    <h1>This <span class="accent">address</span><br>isn't in our index.</h1>
    <p>The page you were looking for doesn't exist, or it's been moved. Start over from the buildings index.</p>
    <div class="btn-row">
      <a class="btn btn-p" href="/buildings/">Browse 64 buildings</a>
      <a class="btn btn-s" href="/methodology/">How we work</a>
    </div>
  </div>
</body>
</html>
