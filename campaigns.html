<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campaigns · CMSF Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0f131d;
  --navy2: #1a1f2e;
  --cream: #e8e3d8;
  --gold: #d4a574;
  --green: #4ade80;
  --red: #ef4444;
  --yellow: #facc15;
  --border: rgba(232,227,216,0.12);
  --muted: rgba(232,227,216,0.6);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--navy); color: var(--cream);
  font-family: 'DM Sans', -apple-system, system-ui, sans-serif;
  font-size: 14px; line-height: 1.5;
}
header {
  padding: 28px 32px 16px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: baseline;
}
header h1 { margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 500; font-style: italic; font-size: 26px; }
header .crumb { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold); letter-spacing: 0.14em; text-transform: uppercase; }
main { padding: 24px 32px 80px; max-width: 1400px; margin: 0 auto; }
section { margin-bottom: 44px; }
section > h2 { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 500; font-size: 22px; margin: 0 0 18px; }
section > h2 .pill { font-family: 'JetBrains Mono', monospace; font-style: normal; font-size: 10px; padding: 3px 8px; border: 1px solid var(--gold); color: var(--gold); border-radius: 999px; margin-left: 10px; letter-spacing: 0.1em; text-transform: uppercase; vertical-align: middle; }
.grid { display: grid; gap: 14px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 920px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } .grid-3 { grid-template-columns: 1fr; } }
.card {
  background: var(--navy2); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 20px;
}
.card-stat { display: flex; flex-direction: column; gap: 4px; }
.card-stat .label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.card-stat .value { font-family: 'Playfair Display', Georgia, serif; font-weight: 500; font-size: 32px; }
.card-stat .sub   { font-size: 12px; color: var(--muted); }
.progress { background: rgba(232,227,216,0.08); height: 6px; border-radius: 3px; margin-top: 8px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--gold); transition: width .4s; }
.campaign {
  background: var(--navy2); border: 1px solid var(--border); border-radius: 14px;
  padding: 24px; display: grid; gap: 16px;
}
.campaign-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.campaign-head h3 { margin: 0; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 500; font-size: 22px; }
.campaign-head .slug { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold); }
.status { font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 4px 10px; border-radius: 999px; letter-spacing: 0.14em; text-transform: uppercase; }
.status.active   { background: rgba(74,222,128,0.12); color: var(--green); border: 1px solid rgba(74,222,128,0.3); }
.status.paused   { background: rgba(250,204,21,0.12); color: var(--yellow); border: 1px solid rgba(250,204,21,0.3); }
.status.complete { background: rgba(212,165,116,0.12); color: var(--gold); border: 1px solid rgba(212,165,116,0.3); }
.status.draft    { background: rgba(232,227,216,0.08); color: var(--muted); border: 1px solid var(--border); }
.countdown {
  background: var(--navy); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 20px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
}
.countdown .timer { font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 500; color: var(--gold); letter-spacing: -0.01em; }
.countdown .label { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 4px; }
.countdown .next-info { font-size: 13px; color: rgba(232,227,216,0.78); margin-top: 6px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  padding: 10px 18px; border-radius: 10px; font-weight: 500; font-size: 13px;
  border: 1px solid var(--border); background: transparent; color: var(--cream);
  cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  font-family: inherit;
}
.btn:hover { border-color: rgba(232,227,216,0.3); background: rgba(232,227,216,0.04); }
.btn.primary { background: var(--gold); color: var(--navy2); border-color: var(--gold); font-weight: 600; }
.btn.primary:hover { background: #e0b88a; }
.btn.danger { color: var(--red); border-color: rgba(239,68,68,0.3); }
.btn.danger:hover { background: rgba(239,68,68,0.06); border-color: var(--red); }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; user-select: none; }
.toggle input { display: none; }
.toggle .track { width: 32px; height: 18px; background: rgba(232,227,216,0.15); border-radius: 999px; position: relative; transition: .2s; }
.toggle .track::after { content:''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: var(--cream); border-radius: 50%; transition: .2s; }
.toggle input:checked + .track { background: var(--gold); }
.toggle input:checked + .track::after { transform: translateX(14px); background: var(--navy2); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
th { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500; }
.mission-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px; margin-top: 12px; }
.mission-tile { aspect-ratio: 1; background: rgba(232,227,216,0.06); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--muted); padding: 4px; text-align: center; cursor: help; position: relative; }
.mission-tile.reached { background: rgba(212,165,116,0.4); color: var(--cream); }
.mission-tile.contact-only { background: rgba(212,165,116,0.12); color: rgba(232,227,216,0.7); }
.mission-tile:hover { outline: 1px solid var(--gold); }
.muted { color: var(--muted); font-size: 12px; }
.kbd { font-family: 'JetBrains Mono', monospace; font-size: 11px; background: rgba(232,227,216,0.06); padding: 2px 6px; border-radius: 4px; }
.error { color: var(--red); padding: 16px; background: rgba(239,68,68,0.06); border-radius: 8px; border: 1px solid rgba(239,68,68,0.3); }
.spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div>
    <div class="crumb">Admin · Campaigns Console</div>
    <h1>The email mission</h1>
  </div>
  <div>
    <a href="/admin/" class="btn">&larr; Back to admin</a>
  </div>
</header>

<main>
  <!-- Mission topline -->
  <section>
    <h2>Mission status <span class="pill">Complete market saturation</span></h2>
    <div class="grid grid-4" id="topline"></div>
  </section>

  <!-- Active campaigns + countdown -->
  <section>
    <h2>Active campaigns</h2>
    <div id="campaigns"></div>
  </section>

  <!-- Mission map -->
  <section>
    <h2>Mission map <span class="pill">by market</span></h2>
    <div id="mission_by_market"></div>
  </section>

  <!-- Email template catalog -->
  <section>
    <h2>Email type catalog <span class="pill">10 templates</span></h2>
    <div id="templates"></div>
  </section>

  <!-- Buildings unreached -->
  <section>
    <h2>Top unreached buildings <span class="pill">priority targets</span></h2>
    <div class="card" style="padding:0;overflow:hidden;"><div id="unreached"></div></div>
  </section>

  <!-- Wave history -->
  <section>
    <h2>Wave history</h2>
    <div class="card" style="padding:0;overflow:hidden;"><div id="waves"></div></div>
  </section>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://kfqphwerygccpzntbbif.supabase.co';
const anonKey = localStorage.getItem('cms_admin_anon_key_v1');
if (!anonKey) {
  document.querySelector('main').innerHTML = '<div class="error">Missing anon key in localStorage (<span class="kbd">cms_admin_anon_key_v1</span>). Set it from the main admin login and reload.</div>';
  throw new Error('no anon key');
}
const sb = createClient(SUPABASE_URL, anonKey);

function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtCountdown(ts) {
  if (!ts) return '—';
  const ms = new Date(ts).getTime() - Date.now();
  if (ms <= 0) return 'READY NOW';
  const total = Math.floor(ms / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return `${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
}
function fmtTime(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleString('en-US',{ timeZone: 'America/Los_Angeles', month:'short', day:'numeric', hour:'numeric', minute:'2-digit', hour12:true })+' PT';
}

// ─── Mission topline ───────────────────────────────────────────────
async function renderTopline() {
  const { data, error } = await sb.from('v_mission_topline').select('*').maybeSingle();
  if (error || !data) return;
  const pct = data.buildings_with_contacts > 0
    ? Math.round(100 * data.buildings_reached / data.buildings_with_contacts) : 0;
  document.getElementById('topline').innerHTML = `
    <div class="card card-stat">
      <span class="label">Catalogued buildings</span>
      <span class="value">${data.catalogued_buildings}</span>
      <span class="sub">${data.buildings_with_contacts} with contacts on file</span>
    </div>
    <div class="card card-stat">
      <span class="label">Buildings reached</span>
      <span class="value">${data.buildings_reached}</span>
      <span class="sub">${pct}% of contactable</span>
      <div class="progress"><span style="width:${pct}%"></span></div>
    </div>
    <div class="card card-stat">
      <span class="label">Total sends · unique</span>
      <span class="value">${data.total_sends} · ${data.unique_recipients}</span>
      <span class="sub">${data.oos_units_total} OOS units in pipeline</span>
    </div>
    <div class="card card-stat">
      <span class="label">Claims · templates active</span>
      <span class="value">${data.total_claims} · ${data.active_templates}/${data.total_templates_in_catalog}</span>
      <span class="sub">target: 100% catalog active</span>
    </div>`;
}

// ─── Active campaigns ──────────────────────────────────────────────
const tickers = [];
async function renderCampaigns() {
  const container = document.getElementById('campaigns');
  const { data: campaigns, error } = await sb.from('campaigns').select('*').in('status',['active','paused','draft']).order('next_batch_at',{ascending:true});
  if (error) { container.innerHTML = `<div class="error">${esc(error.message)}</div>`; return; }
  if (!campaigns?.length) { container.innerHTML = '<div class="muted">No active campaigns. Use SQL editor or main admin to create one.</div>'; return; }

  container.innerHTML = '';
  for (const c of campaigns) {
    const { data: nextBatchData } = await sb.rpc('campaign_next_batch_size', { p_campaign_id: c.id });
    const nextSize = nextBatchData ?? c.batch_size_initial;
    const { count: wavesFired } = await sb.from('campaign_waves').select('*',{count:'exact',head:true}).eq('campaign_id', c.id);

    const card = el(`<div class="campaign">
      <div class="campaign-head">
        <div>
          <h3>${esc(c.name)}</h3>
          <div class="slug">${esc(c.slug)} · ${esc(c.template_slug)}</div>
        </div>
        <div class="btns" style="gap:12px;align-items:center;">
          <span class="status ${esc(c.status)}">${esc(c.status)}</span>
          <label class="toggle" title="When ON, cron auto-fires at scheduled time. When OFF, you must manually fire each wave.">
            <input type="checkbox" data-action="toggle_auto" data-id="${c.id}" ${c.auto_fire ? 'checked' : ''}>
            <span class="track"></span>
            <span>Auto-fire</span>
          </label>
        </div>
      </div>
      <div class="countdown">
        <div>
          <div class="label">Next batch in</div>
          <div class="timer" data-countdown="${c.next_batch_at ?? ''}">${fmtCountdown(c.next_batch_at)}</div>
          <div class="next-info">Scheduled: <b>${fmtTime(c.next_batch_at)}</b> · Wave ${(wavesFired||0)+1} · <b>${nextSize} recipients</b> · cadence every ${c.cadence_hours}h</div>
        </div>
        <div class="btns">
          <button class="btn primary" data-action="fire_now" data-id="${c.id}">Fire now</button>
          <button class="btn" data-action="${c.status==='paused' ? 'resume':'pause'}" data-id="${c.id}">${c.status==='paused' ? 'Resume' : 'Pause'}</button>
          <button class="btn" data-action="preview" data-id="${c.id}" data-size="${nextSize}">Preview next ${nextSize}</button>
        </div>
      </div>
      <div class="grid grid-4" style="margin-top:4px;">
        <div class="card-stat"><span class="label">Waves fired</span><span class="value" style="font-size:22px;">${wavesFired || 0}</span></div>
        <div class="card-stat"><span class="label">Batch initial → max</span><span class="value" style="font-size:22px;">${c.batch_size_initial} → ${c.batch_size_max}</span></div>
        <div class="card-stat"><span class="label">Growth factor</span><span class="value" style="font-size:22px;">×${c.batch_growth_factor}</span></div>
        <div class="card-stat"><span class="label">Per-recipient cool-down</span><span class="value" style="font-size:22px;">${c.per_recipient_min_days}d</span></div>
      </div>
    </div>`);
    container.appendChild(card);
    tickers.push({ campaign_id: c.id, target: c.next_batch_at });
  }

  container.addEventListener('click', onCampaignAction, { once: false });
  container.addEventListener('change', onCampaignToggle, { once: false });
}
async function onCampaignAction(e) {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  btn.disabled = true; const orig = btn.textContent; btn.innerHTML = '<span class="spinner"></span>';
  try {
    if (action === 'fire_now') {
      if (!confirm('Fire the next wave NOW? This sends real emails to real recipients.')) return;
      const { data, error } = await sb.rpc('fire_campaign_wave', { p_campaign_id: id, p_fired_by: 'manual_dashboard' });
      if (error) throw error;
      alert(`Fire result: ${JSON.stringify(data, null, 2)}`);
      location.reload();
    } else if (action === 'pause') {
      await sb.from('campaigns').update({ status: 'paused', status_reason: 'manual pause from dashboard' }).eq('id', id);
      location.reload();
    } else if (action === 'resume') {
      await sb.from('campaigns').update({ status: 'active', status_reason: null, pause_until: null }).eq('id', id);
      location.reload();
    } else if (action === 'preview') {
      const size = parseInt(btn.dataset.size, 10) || 10;
      const { data, error } = await sb.rpc('campaign_pick_recipients', { p_campaign_id: id, p_limit: Math.min(size, 25) });
      if (error) throw error;
      const lines = (data || []).map((r,i) => `${i+1}. ${r.first_name} ${r.last_name} · ${r.building_name} · ${r.email}`).join('\n');
      alert(`Next ${data?.length || 0} recipients:\n\n${lines}`);
    }
  } catch (err) {
    alert('Error: ' + (err.message || err));
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
}
async function onCampaignToggle(e) {
  const inp = e.target.closest('input[data-action="toggle_auto"]');
  if (!inp) return;
  const id = inp.dataset.id;
  const newVal = inp.checked;
  if (newVal && !confirm('Enable AUTO-FIRE? When enabled, the system will automatically send the next wave at its scheduled time without manual approval. You will still receive a notification 1 hour before each fire.')) {
    inp.checked = false; return;
  }
  await sb.from('campaigns').update({ auto_fire: newVal }).eq('id', id);
}

// Live countdown tick
setInterval(() => {
  document.querySelectorAll('[data-countdown]').forEach(el => {
    const target = el.dataset.countdown;
    el.textContent = fmtCountdown(target);
    if (target && new Date(target).getTime() <= Date.now()) {
      el.style.color = 'var(--green)';
    }
  });
}, 1000);

// ─── Mission map by market ─────────────────────────────────────────
async function renderMissionByMarket() {
  const { data } = await sb.from('v_mission_by_market').select('*').order('catalogued_buildings',{ascending:false});
  const container = document.getElementById('mission_by_market');
  container.innerHTML = (data || []).map(m => {
    const pct = m.buildings_with_email > 0 ? Math.round(100 * m.buildings_reached / m.buildings_with_email) : 0;
    return `<div class="card" style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
        <div><b style="font-size:16px;">${esc(m.market_name)}</b> <span class="muted" style="margin-left:8px;">${esc(m.market_slug)}</span></div>
        <div class="muted">${m.buildings_reached} / ${m.buildings_with_email} contactable buildings reached (${pct}%)</div>
      </div>
      <div class="progress"><span style="width:${pct}%"></span></div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px;font-size:12px;">
        <div><span class="muted">Catalogued</span><br><b>${m.catalogued_buildings}</b></div>
        <div><span class="muted">With contacts</span><br><b>${m.buildings_with_email}</b></div>
        <div><span class="muted">Reached</span><br><b>${m.buildings_reached}</b></div>
        <div><span class="muted">OOS units</span><br><b>${m.oos_units}</b></div>
      </div>
    </div>`;
  }).join('');
}

// ─── Template catalog ──────────────────────────────────────────────
async function renderTemplates() {
  const { data } = await sb.from('v_mission_by_template').select('*');
  document.getElementById('templates').innerHTML = `<div class="card" style="padding:0;overflow:hidden;"><table>
    <tr><th>Template</th><th>Category</th><th>Trigger</th><th>Status</th><th>Reached</th><th>Open %</th><th>Last sent</th></tr>
    ${(data || []).map(t => `<tr>
      <td><b>${esc(t.name)}</b><br><span class="muted" style="font-family:'JetBrains Mono',monospace;font-size:11px;">${esc(t.slug)}</span></td>
      <td>${esc(t.category ?? '')}</td>
      <td>${esc(t.trigger_type ?? '')}</td>
      <td><span class="status ${t.is_active ? 'active':'draft'}">${t.is_active ? 'active':'draft'}</span></td>
      <td>${t.recipients_reached}</td>
      <td>${t.open_rate_pct || 0}%</td>
      <td>${t.last_send_at ? fmtTime(t.last_send_at) : '—'}</td>
    </tr>`).join('')}
  </table></div>`;
}

// ─── Unreached buildings ───────────────────────────────────────────
async function renderUnreached() {
  const { data } = await sb.from('v_buildings_unreached').select('*').limit(25);
  document.getElementById('unreached').innerHTML = `<table>
    <tr><th>Building</th><th>City</th><th>Units</th><th>OOS</th><th>Contacts on file</th></tr>
    ${(data || []).map(b => `<tr>
      <td><b>${esc(b.building_name)}</b></td>
      <td>${esc(b.city_name)}</td>
      <td>${b.unit_count ?? '—'}</td>
      <td>${b.oos_units}</td>
      <td>${b.contact_emails_available}</td>
    </tr>`).join('')}
  </table>`;
}

// ─── Wave history ──────────────────────────────────────────────────
async function renderWaves() {
  const { data } = await sb.from('campaign_waves').select('*, campaigns!inner(slug,name)').order('fired_at',{ascending:false}).limit(50);
  document.getElementById('waves').innerHTML = `<table>
    <tr><th>Wave</th><th>Campaign</th><th>Size</th><th>Fired</th><th>By</th><th>Delivered</th><th>Bounced</th><th>Opened</th><th>Clicked</th></tr>
    ${(data || []).map(w => `<tr>
      <td>#${w.wave_number}</td>
      <td><b>${esc(w.campaigns?.slug)}</b></td>
      <td>${w.batch_size}</td>
      <td>${fmtTime(w.fired_at)}</td>
      <td><span class="muted">${esc(w.fired_by)}</span></td>
      <td>${w.delivered_count} <span class="muted">/${w.sent_count}</span></td>
      <td>${w.bounced_count > 0 ? `<b style="color:var(--red);">${w.bounced_count}</b>` : '0'}</td>
      <td>${w.opened_count}</td>
      <td>${w.clicked_count}</td>
    </tr>`).join('')}
  </table>`;
}

// ─── Kickoff ───────────────────────────────────────────────────────
(async () => {
  try {
    await Promise.all([renderTopline(), renderCampaigns(), renderMissionByMarket(), renderTemplates(), renderUnreached(), renderWaves()]);
  } catch (e) {
    document.querySelector('main').insertAdjacentHTML('afterbegin', `<div class="error">${esc(e.message)}</div>`);
  }
})();

// Auto-refresh every 60s for live metrics
setInterval(() => { renderTopline(); renderCampaigns(); renderWaves(); }, 60000);
</script>
</body>
</html>
