<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Condo Market · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{navy:'#0f131d',navy2:'#1a1f2e',navy3:'#232a3d',cream:'#e8e3d8',bluegray:'#9fb4d8',gold:'#d4a574',sage:'#7c9d6a',brick:'#d88080',amber:'#b89860'},fontFamily:{display:['Playfair Display','Georgia','serif'],sans:['DM Sans','-apple-system','sans-serif'],mono:['JetBrains Mono','monospace']}}}}</script>
<style>
*{box-sizing:border-box}body{background:#0f131d;color:#e8e3d8;font-family:'DM Sans',sans-serif;min-height:100vh;margin:0}
.font-display{font-family:'Playfair Display',Georgia,serif}.font-mono{font-family:'JetBrains Mono',monospace}
.tab{padding:12px 14px;color:rgba(232,227,216,0.5);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-bottom:2px solid transparent;cursor:pointer;text-decoration:none;display:inline-block;transition:all .15s}
.tab:hover{color:#e8e3d8}.tab.active{color:#d4a574;border-bottom-color:#d4a574}
.card{background:#1a1f2e;border:1px solid rgba(232,227,216,0.12);border-radius:10px;padding:18px 20px}
.btn{padding:8px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn-primary{background:#d4a574;color:#0f131d;border-color:#d4a574}.btn-primary:hover{opacity:.88}
.btn-secondary{background:transparent;color:rgba(232,227,216,.78);border-color:rgba(232,227,216,.25)}.btn-secondary:hover{background:rgba(232,227,216,.06);color:#e8e3d8;border-color:rgba(232,227,216,.4)}
.btn-danger{background:transparent;color:#d88080;border-color:rgba(216,128,128,.45)}.btn-danger:hover{background:rgba(216,128,128,.08);color:#e8a8a8}
.btn-sm{padding:5px 12px;font-size:12px}
.tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:rgba(232,227,216,.08);color:rgba(232,227,216,.7);margin-right:4px}
.tag-good{background:rgba(124,157,106,.15);color:#b8d4a8}.tag-bad{background:rgba(216,128,128,.15);color:#e8a8a8}.tag-warn{background:rgba(212,165,116,.15);color:#d4a574}
input[type=text],input[type=email],input[type=number],input[type=datetime-local],input[type=search],select,textarea{background:#0f131d;border:1px solid rgba(232,227,216,.18);border-radius:6px;color:#e8e3d8;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:14px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:#d4a574}
table{width:100%;border-collapse:collapse;font-size:13px}thead{background:#232a3d}
th{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(232,227,216,.55);font-weight:400;padding:10px 14px;text-align:left;border-bottom:1px solid rgba(232,227,216,.1)}
td{padding:12px 14px;vertical-align:top;border-top:1px solid rgba(232,227,216,.06)}
tr:hover td{background:rgba(232,227,216,.02)}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(232,227,216,.2);border-top-color:#d4a574;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flash{padding:12px 18px;border-radius:8px;margin-bottom:18px;font-size:14px}
.flash-ok{background:rgba(124,157,106,.12);border:1px solid rgba(124,157,106,.4);color:#b8d4a8}
.flash-err{background:rgba(216,128,128,.12);border:1px solid rgba(216,128,128,.4);color:#e8a8a8}
.placeholder{background:#1a1f2e;border:1px dashed rgba(232,227,216,.14);border-radius:10px;padding:32px;text-align:center;color:rgba(232,227,216,.5);font-size:13px}
.drawer{position:fixed;top:0;right:0;width:100%;max-width:680px;height:100vh;background:#0f131d;border-left:1px solid rgba(232,227,216,.15);overflow-y:auto;z-index:50;box-shadow:-12px 0 40px rgba(0,0,0,.5);padding:24px 28px}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49}
.action-prop{background:linear-gradient(180deg,rgba(212,165,116,.06),#1a1f2e);border:1px solid rgba(212,165,116,.4);border-radius:10px;padding:18px 22px;margin-top:14px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#0f131d}::-webkit-scrollbar-thumb{background:#232a3d;border-radius:5px}::-webkit-scrollbar-thumb:hover{background:#353e52}
</style>
</head>
<body>

<div id="loading" class="fixed inset-0 flex items-center justify-center"><div class="spinner"></div></div>

<div id="auth-screen" hidden class="min-h-screen flex items-center justify-center px-6">
  <div class="card max-w-md w-full">
    <h1 class="font-display text-3xl italic mb-2">Condo <span class="text-bluegray">Market</span></h1>
    <p class="text-cream/60 text-sm mb-6">Admin sign in</p>
    <form id="signin-form" class="space-y-3">
      <input type="email" name="email" placeholder="tim@mcmullen.properties" required autocomplete="email">
      <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
      <button type="submit" class="btn btn-primary w-full justify-center">Sign in</button>
      <p id="signin-error" class="text-brick text-xs mt-2 hidden"></p>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="border-b border-cream/10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <span class="font-display italic text-2xl">Condo <span class="text-bluegray">Market</span></span>
        <span class="font-mono text-[10px] tracking-[0.14em] uppercase text-gold border border-gold/40 rounded-full px-3 py-1">admin v5</span>
      </div>
      <div class="flex items-center gap-3 text-xs text-cream/60">
        <span id="user-email" class="font-mono"></span>
        <button id="signout-btn" class="btn btn-secondary btn-sm">Sign out</button>
      </div>
    </div>
    <nav class="max-w-7xl mx-auto px-6 flex gap-0 overflow-x-auto" id="nav">
      <a class="tab" data-tab="home">Home</a>
      <a class="tab" data-tab="people">People</a>
      <a class="tab" data-tab="hoa">HOAs</a>
      <a class="tab" data-tab="email">Email</a>
      <a class="tab" data-tab="queue">Queue</a>
      <a class="tab" data-tab="buildings">Buildings</a>
      <a class="tab" data-tab="mmm">MMM</a>
      <a class="tab" data-tab="analytics">Analytics</a>
      <a class="tab" data-tab="settings">Settings</a>
    </nav>
  </header>
  <main id="content" class="max-w-7xl mx-auto px-6 py-8"></main>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://kfqphwerygccpzntbbif.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmcXBod2VyeWdjY3B6bnRiYmlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzOTgxODQsImV4cCI6MjA5MTk3NDE4NH0.FGQD3BMLVLD9lE8LUBUjD3SqKhsCxjdnCiGV8MMnqpg';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (s,c=document) => c.querySelector(s);
const $$ = (s,c=document) => Array.from(c.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum = (n) => n == null ? '—' : Number(n).toLocaleString('en-US');
const fmtMoney = (n) => n == null ? '—' : '$' + Math.round(Number(n)).toLocaleString('en-US');
const fmtPct = (num, denom) => !denom ? '—' : ((num/denom)*100).toFixed(num/denom < 0.01 ? 1 : 0) + '%';
const relTime = (iso) => {
  if (!iso) return '—';
  const ms = Date.now() - new Date(iso).getTime();
  const future = ms < 0, abs = Math.abs(ms);
  const s = Math.floor(abs/1000); if (s < 60) return future ? `in ${s}s` : `${s}s ago`;
  const m = Math.floor(s/60);     if (m < 60) return future ? `in ${m}m` : `${m}m ago`;
  const h = Math.floor(m/60);     if (h < 24) return future ? `in ${h}h` : `${h}h ago`;
  const d = Math.floor(h/24);     return future ? `in ${d}d` : `${d}d ago`;
};
const fmtDate = (iso) => !iso ? '—' : new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });

let currentUser = null;
let currentTab = 'home';

// ========================= AUTH =========================
async function checkAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showSignIn(); return false; }
  const { data: profile } = await sb.from('profiles').select('id, email, full_name, role').eq('id', session.user.id).maybeSingle();
  if (!profile || profile.role !== 'admin') {
    await sb.auth.signOut();
    showSignIn('Admin access required.');
    return false;
  }
  currentUser = { ...session.user, ...profile };
  $('#user-email').textContent = profile.email;
  showApp();
  return true;
}
function showSignIn(err) {
  $('#loading').hidden = true; $('#app').hidden = true; $('#auth-screen').hidden = false;
  if (err) { $('#signin-error').textContent = err; $('#signin-error').classList.remove('hidden'); }
}
function showApp() {
  $('#loading').hidden = true; $('#auth-screen').hidden = true; $('#app').hidden = false;
  routeFromHash();
}

$('#signin-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const { error } = await sb.auth.signInWithPassword({ email: fd.get('email'), password: fd.get('password') });
  if (error) { $('#signin-error').textContent = error.message; $('#signin-error').classList.remove('hidden'); return; }
  await checkAuth();
});
$('#signout-btn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

// ========================= ROUTER =========================
function routeFromHash() {
  const hash = location.hash.replace('#', '') || 'home';
  const [tab, ...rest] = hash.split('/');
  currentTab = tab;
  $$('#nav .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  const renderers = { home: renderHome, people: renderPeople, hoa: renderHoa, email: renderEmail, queue: renderQueue, buildings: renderBuildings, mmm: renderMmm, analytics: renderAnalytics, settings: renderSettings };
  const renderer = renderers[tab] || renderHome;
  renderer(rest);
}
$$('#nav .tab').forEach(t => t.addEventListener('click', e => { e.preventDefault(); location.hash = t.dataset.tab; }));
window.addEventListener('hashchange', routeFromHash);

// ========================= HOME (Claude command + key stats) =========================
async function renderHome() {
  const c = $('#content');
  c.innerHTML = `
    <section class="mb-8">
      <h1 class="font-display text-4xl italic mb-1">Welcome back, Tim.</h1>
      <p class="text-cream/60 text-sm">Ask Claude. Pull data. Draft campaigns. Manage everything from here.</p>
    </section>

    <section class="card mb-8 border-gold/40" style="background:linear-gradient(180deg,rgba(212,165,116,0.04),#1a1f2e);">
      <div class="flex items-center gap-2 mb-3">
        <span class="text-gold font-mono text-[10px] tracking-[0.14em] uppercase">⚡ Claude Command</span>
        <span class="text-cream/40 text-xs">— natural language interface to your entire platform</span>
      </div>
      <textarea id="cmd-input" rows="3" placeholder="Try: 'Send a Just Sold email to all Madrone owners about Unit 421 for $1.85M', or 'Show me top buildings by open rate this week'" class="!bg-navy"></textarea>
      <div class="flex items-center justify-between mt-3 gap-3 flex-wrap">
        <div class="flex gap-2 flex-wrap text-xs">
          <button class="btn btn-secondary btn-sm" data-prompt="How many active MMM listings do we have right now?">Stats query</button>
          <button class="btn btn-secondary btn-sm" data-prompt="Show me all owners at 480 Mission Bay Blvd N with high open rates">People query</button>
          <button class="btn btn-secondary btn-sm" data-prompt="What's the open rate of wave 3 compared to wave 2?">CRO query</button>
          <button class="btn btn-secondary btn-sm" data-prompt="Create a task to follow up with the Madrone HOA tomorrow at 2pm">Create task</button>
        </div>
        <button id="cmd-run" class="btn btn-primary">Run Command <span class="font-mono text-[10px] opacity-60">⌘↵</span></button>
      </div>
      <div id="cmd-result" class="mt-4"></div>
    </section>

    <section class="mb-8">
      <h2 class="font-display text-xl mb-4">Today</h2>
      <div id="home-stats" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <div class="card"><div class="font-mono text-[10px] tracking-[0.14em] uppercase text-cream/50 mb-2">Loading…</div><div class="spinner"></div></div>
      </div>
      <div id="home-tasks"></div>
    </section>
  `;
  // Wire up command interface
  $('#cmd-run').addEventListener('click', runCommand);
  $('#cmd-input').addEventListener('keydown', e => { if ((e.metaKey||e.ctrlKey) && e.key==='Enter') runCommand(); });
  $$('[data-prompt]').forEach(b => b.addEventListener('click', () => { $('#cmd-input').value = b.dataset.prompt; $('#cmd-input').focus(); }));
  // Load stats
  loadHomeStats();
  loadHomeTasks();
}

async function loadHomeStats() {
  const { data: stats } = await sb.from('v_platform_stats').select('*').maybeSingle();
  const { data: cap } = await sb.from('v_send_capacity_by_city').select('*').eq('city_slug','san-francisco').maybeSingle();
  if (!stats) return;
  $('#home-stats').innerHTML = [
    ['Total people', fmtNum(stats.total_people), `${fmtNum(stats.active_accounts)} accounts`],
    ['Active MMMs', fmtNum(stats.active_mmms), `${fmtNum(stats.open_offers)} open offers`],
    ['Open tasks', fmtNum(stats.open_tasks), stats.overdue_tasks > 0 ? `<span class="text-brick">${stats.overdue_tasks} overdue</span>` : 'on track'],
    ['Today\'s capacity', `${fmtNum(cap?.sent_today||0)}/${fmtNum(cap?.daily_cap||0)}`, `${fmtNum(cap?.remaining_today||0)} remaining`],
  ].map(([l,n,sub]) => `<div class="card"><div class="font-mono text-[10px] tracking-[0.14em] uppercase text-cream/50 mb-2">${esc(l)}</div><div class="font-display text-3xl">${n}</div><div class="text-xs text-cream/55 mt-1">${sub}</div></div>`).join('');
}
async function loadHomeTasks() {
  const { data: tasks } = await sb.from('v_admin_inbox').select('*').order('priority',{ascending:false}).order('due_at',{ascending:true,nullsFirst:false}).limit(5);
  if (!tasks || !tasks.length) { $('#home-tasks').innerHTML = '<div class="placeholder">No open tasks. Inbox is clear.</div>'; return; }
  $('#home-tasks').innerHTML = `<h3 class="font-display text-base mb-3">Top priorities (${tasks.length})</h3><div class="space-y-2">${tasks.map(t => `
    <div class="card flex items-center justify-between gap-4">
      <div class="flex-1 min-w-0">
        <div class="flex gap-2 items-baseline mb-1">
          <span class="tag ${t.priority==='urgent'?'tag-bad':t.priority==='high'?'tag-warn':''}">${esc(t.priority)}</span>
          <span class="font-mono text-[10px] tracking-[0.1em] uppercase text-cream/50">${esc(t.task_type)}</span>
          ${t.due_at ? `<span class="font-mono text-[10px] text-cream/40">${esc(relTime(t.due_at))}</span>` : ''}
        </div>
        <div class="font-medium text-cream">${esc(t.title)}</div>
        ${t.description ? `<div class="text-xs text-cream/60 mt-1">${esc(t.description)}</div>` : ''}
      </div>
      <button class="btn btn-secondary btn-sm" data-task-done="${esc(t.id)}">Done</button>
    </div>`).join('')}</div>`;
  $$('[data-task-done]').forEach(b => b.addEventListener('click', async () => {
    await sb.from('admin_tasks').update({ status:'done', completed_at:new Date().toISOString() }).eq('id', b.dataset.taskDone);
    loadHomeTasks();
  }));
}

async function runCommand() {
  const input = $('#cmd-input');
  const text = input.value.trim();
  if (text.length < 3) return;
  const result = $('#cmd-result');
  result.innerHTML = '<div class="card flex items-center gap-3"><div class="spinner"></div><span class="text-cream/60 text-sm">Thinking…</span></div>';
  try {
    const { data: { session } } = await sb.auth.getSession();
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/admin-command`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${session.access_token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ command: text })
    });
    const json = await resp.json();
    if (!json.ok) { result.innerHTML = `<div class="flash flash-err">${esc(json.error || 'Command failed')}</div>`; return; }
    if (json.parse_error) { result.innerHTML = `<div class="flash flash-err">Claude returned non-JSON: ${esc(json.parse_error)}</div>`; return; }
    renderActionProposal(json.action, json.duration_ms);
  } catch (e) {
    result.innerHTML = `<div class="flash flash-err">Network error: ${esc(e.message)}</div>`;
  }
}

function renderActionProposal(a, durationMs) {
  const result = $('#cmd-result');
  if (!a) { result.innerHTML = '<div class="flash flash-err">Empty response from Claude.</div>'; return; }
  const warningsHtml = (a.warnings || []).length ? `<div class="text-brick text-xs mt-2">⚠ ${a.warnings.map(esc).join(' · ')}</div>` : '';
  let bodyHtml = '';
  if (a.intent === 'clarify') {
    bodyHtml = `<div class="text-cream/80">${esc(a.clarification_needed || a.summary)}</div>`;
  } else if (a.intent === 'info') {
    bodyHtml = `<div class="text-cream/80">${esc(a.summary)}</div>${a.explanation ? `<div class="text-xs text-cream/60 mt-2">${esc(a.explanation)}</div>` : ''}`;
  } else if (a.intent === 'query' && a.sql) {
    bodyHtml = `<div class="text-cream/80 mb-2">${esc(a.summary)}</div>
      ${a.explanation ? `<div class="text-xs text-cream/60 mb-3">${esc(a.explanation)}</div>` : ''}
      <pre class="font-mono text-xs bg-navy p-3 rounded border border-cream/10 overflow-x-auto">${esc(a.sql)}</pre>
      <div class="mt-3 flex gap-2">
        <button class="btn btn-primary btn-sm" id="run-sql-btn">Execute query</button>
        <button class="btn btn-secondary btn-sm" id="cancel-action">Cancel</button>
      </div>
      <div id="sql-result" class="mt-3"></div>`;
  } else if (a.intent === 'send_email' && a.email) {
    bodyHtml = `<div class="text-cream/80 mb-2">${esc(a.summary)}</div>
      <div class="text-xs text-cream/60 mb-3">${esc(a.explanation || '')}</div>
      <div class="space-y-1 text-sm">
        <div><span class="text-cream/50">Template:</span> <span class="font-mono text-gold">${esc(a.email.template_slug)}</span></div>
        <div><span class="text-cream/50">Recipients:</span> ${esc(a.email.recipient_description || JSON.stringify(a.email.recipient_config))}</div>
        ${a.email.estimated_recipients !== null && a.email.estimated_recipients !== undefined ? `<div><span class="text-cream/50">Estimated count:</span> <span class="font-mono">${fmtNum(a.email.estimated_recipients)}</span></div>` : ''}
        <div><span class="text-cream/50">Campaign key:</span> <span class="font-mono text-xs">${esc(a.email.campaign_key)}</span></div>
        ${a.email.merge_vars ? `<div><span class="text-cream/50">Merge vars:</span> <span class="font-mono text-xs">${esc(JSON.stringify(a.email.merge_vars))}</span></div>` : ''}
      </div>
      <div class="mt-3 flex gap-2">
        <button class="btn btn-secondary btn-sm" id="draft-to-me">Draft to me first</button>
        <button class="btn btn-primary btn-sm" id="send-real" disabled title="Sprint B: full send pipeline">Send (disabled in v1.0)</button>
        <button class="btn btn-secondary btn-sm" id="cancel-action">Cancel</button>
      </div>`;
  } else if (a.intent === 'create_task' && a.task) {
    bodyHtml = `<div class="text-cream/80 mb-2">${esc(a.summary)}</div>
      <div class="space-y-1 text-sm mt-3">
        <div><span class="text-cream/50">Title:</span> ${esc(a.task.title)}</div>
        ${a.task.description ? `<div><span class="text-cream/50">Description:</span> ${esc(a.task.description)}</div>` : ''}
        <div><span class="text-cream/50">Type:</span> <span class="font-mono">${esc(a.task.task_type)}</span></div>
        <div><span class="text-cream/50">Priority:</span> <span class="font-mono">${esc(a.task.priority)}</span></div>
        ${a.task.due_at ? `<div><span class="text-cream/50">Due:</span> ${esc(fmtDate(a.task.due_at))} (${esc(relTime(a.task.due_at))})</div>` : ''}
      </div>
      <div class="mt-3 flex gap-2">
        <button class="btn btn-primary btn-sm" id="create-task-btn">Create task</button>
        <button class="btn btn-secondary btn-sm" id="cancel-action">Cancel</button>
      </div>`;
  } else {
    bodyHtml = `<div class="text-cream/80">${esc(a.summary || 'Unsupported intent.')}</div><pre class="font-mono text-[10px] mt-2 text-cream/40">${esc(JSON.stringify(a, null, 2))}</pre>`;
  }
  result.innerHTML = `<div class="action-prop">
    <div class="flex items-center gap-2 mb-2">
      <span class="tag tag-${a.confidence==='high'?'good':a.confidence==='low'?'bad':'warn'}">${esc(a.confidence||'?')} confidence</span>
      <span class="font-mono text-[10px] text-cream/40">${esc(a.intent)} · ${durationMs}ms</span>
    </div>
    ${bodyHtml}
    ${warningsHtml}
  </div>`;
  // Wire action buttons
  const cancel = $('#cancel-action'); if (cancel) cancel.addEventListener('click', () => { result.innerHTML = ''; });
  const runSqlBtn = $('#run-sql-btn'); if (runSqlBtn) runSqlBtn.addEventListener('click', async () => {
    const out = $('#sql-result'); out.innerHTML = '<div class="spinner"></div>';

async function renderPeople(rest) {
  if (rest && rest[0]) return renderPersonDetail(rest[0]);
  const c = $('#content');
  const params = new URLSearchParams(location.search);
  const q = params.get('q') || '';
  const hasAccount = params.get('account') || 'all';
  const sort = params.get('sort') || 'last_emailed_desc';
  const page = parseInt(params.get('page') || '0', 10);
  c.innerHTML = `
    <div class="flex items-baseline justify-between mb-4 gap-4 flex-wrap">
      <h1 class="font-display text-3xl italic">People</h1>
      <form id="people-filter" class="flex gap-2 flex-wrap items-center">
        <input type="search" name="q" value="${esc(q)}" placeholder="email, name…" class="!w-56">
        <select name="account">
          <option value="all" ${hasAccount==='all'?'selected':''}>all</option>
          <option value="yes" ${hasAccount==='yes'?'selected':''}>has account</option>
          <option value="no" ${hasAccount==='no'?'selected':''}>no account</option>
        </select>
        <select name="sort">
          <option value="last_emailed_desc" ${sort==='last_emailed_desc'?'selected':''}>Last emailed</option>
          <option value="opens_desc" ${sort==='opens_desc'?'selected':''}>Most opens</option>
          <option value="email_asc" ${sort==='email_asc'?'selected':''}>Email A→Z</option>
          <option value="created_desc" ${sort==='created_desc'?'selected':''}>Newest</option>
        </select>
        <button class="btn btn-primary btn-sm">Apply</button>
      </form>
    </div>
    <div id="people-meta" class="text-xs text-cream/60 mb-3"></div>
    <div id="people-tbl" class="card !p-0 overflow-hidden"><div class="p-8 text-center"><div class="spinner"></div></div></div>
  `;
  $('#people-filter').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const sp = new URLSearchParams();
    if (fd.get('q')) sp.set('q', fd.get('q'));
    if (fd.get('account') !== 'all') sp.set('account', fd.get('account'));
    if (fd.get('sort') !== 'last_emailed_desc') sp.set('sort', fd.get('sort'));
    location.search = sp.toString() ? '?' + sp : '';
  });
  // Query
  let qry = sb.from('v_person_overview').select('*', { count: 'exact' });
  if (q) qry = qry.or(`primary_email.ilike.%${q}%,full_name.ilike.%${q}%,last_name.ilike.%${q}%`);
  if (hasAccount === 'yes') qry = qry.not('profile_id','is',null);
  else if (hasAccount === 'no') qry = qry.is('profile_id', null);
  if (sort === 'last_emailed_desc') qry = qry.order('last_emailed_at',{ascending:false,nullsFirst:false});
  else if (sort === 'opens_desc') qry = qry.order('emails_opened',{ascending:false});
  else if (sort === 'email_asc') qry = qry.order('primary_email',{ascending:true});
  else if (sort === 'created_desc') qry = qry.order('created_at',{ascending:false});
  qry = qry.range(page*50, page*50+49);
  const { data, count } = await qry;
  const totalPages = Math.max(1, Math.ceil((count||0)/50));
  $('#people-meta').innerHTML = `${fmtNum(count||0)} people · page ${page+1}/${totalPages}`;
  const rows = (data||[]).map(p => {
    const opens = p.emails_received > 0 ? fmtPct(p.emails_opened, p.emails_received) : '—';
    const tags = [
      p.has_account ? '<span class="tag tag-good">account</span>' : '',
      p.is_bounced ? '<span class="tag tag-bad">bounced</span>' : '',
      p.is_unsubscribed ? '<span class="tag tag-bad">unsub</span>' : '',
      p.is_dnc ? '<span class="tag tag-bad">DNC</span>' : '',
      p.is_corporate ? '<span class="tag">corp</span>' : '',
    ].filter(Boolean).join('');
    const blds = (p.building_slugs||[]).slice(0,2).join(', ') + ((p.building_slugs||[]).length>2 ? ` +${p.building_slugs.length-2}` : '');
    return `<tr>
      <td><a href="#people/${esc(p.person_id)}" class="font-medium text-cream hover:text-gold">${esc(p.full_name || p.primary_email)}</a><div class="font-mono text-[11px] text-cream/50">${esc(p.primary_email)}</div></td>
      <td class="text-cream/80">${esc(blds)||'—'}<div class="text-[11px] text-cream/45 font-mono">${p.owned_building_count} bldg</div></td>
      <td>${fmtNum(p.emails_received)}<div class="text-[11px] text-cream/45 font-mono">${opens} open</div></td>
      <td class="font-mono text-xs text-cream/70">${esc(relTime(p.last_emailed_at))}</td>
      <td>${tags||'—'}</td>
    </tr>`;
  }).join('');
  $('#people-tbl').innerHTML = `<table>
    <thead><tr><th>Person</th><th>Buildings</th><th>Emails</th><th>Last emailed</th><th>Flags</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="5" class="text-center text-cream/50 p-8">No match.</td></tr>'}</tbody>
  </table>
  <div class="flex justify-between items-center p-4 border-t border-cream/10 text-xs text-cream/60">
    <span class="font-mono">Page ${page+1} of ${totalPages}</span>
    <div class="flex gap-2">
      ${page > 0 ? `<a class="btn btn-secondary btn-sm" href="?${new URLSearchParams({...Object.fromEntries(new URLSearchParams(location.search)),page:String(page-1)}).toString()}">← Prev</a>` : ''}
      ${page+1 < totalPages ? `<a class="btn btn-secondary btn-sm" href="?${new URLSearchParams({...Object.fromEntries(new URLSearchParams(location.search)),page:String(page+1)}).toString()}">Next →</a>` : ''}
    </div>
  </div>`;
}

async function openHoaEditor(slug) {

  const backdrop = document.createElement('div'); backdrop.className = 'drawer-backdrop';
  const drawer = document.createElement('div'); drawer.className = 'drawer';
  drawer.innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-display text-2xl italic">${esc(slug)}</h2>
      <button class="btn btn-secondary btn-sm" id="hoa-close">Close</button>

      </label>
      <div class="grid grid-cols-2 gap-3">
        <label class="block"><span class="font-mono text-[10px] tracking-[0.12em] uppercase text-cream/60">Next action</span><input type="datetime-local" name="next_action_at" value="${hoa.next_action_at ? new Date(hoa.next_action_at).toISOString().slice(0,16) : ''}"></label>

    <form id="add-contact-form" class="space-y-2 card">

    e.preventDefault();
    const fd = new FormData(e.target);
    const updates = {
      status: fd.get('status'),
      company_id: fd.get('company_id') || null,
      next_action_at: fd.get('next_action_at') || null,
      last_contacted_at: fd.get('last_contacted_at') || null,
      notes: fd.get('notes') || null,
    };

    if (error) { alert('Save failed: ' + error.message); return; }
    close(); renderHoa();
  });

    e.preventDefault();
    const fd = new FormData(e.target);

      building_slug: slug,
      full_name: fd.get('full_name'),
      role: fd.get('role'),
      email: fd.get('email') || null,
      phone: fd.get('phone') || null,
      is_primary: fd.get('is_primary') === 'on',
    });
    if (error) { alert('Add failed: ' + error.message); return; }
