<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Condo Market SF</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f131d;--navy2:#1a1f2e;--navy3:#232a3a;--cream:#e8e3d8;--gold:#d4a574;--blue-gray:#9fb4d8;--success:#8fb97a;--warn:#d9a44b;--coral:#c97865;--hot:#c97865;--warm:#d9a44b;--cool:#9fb4d8;--cold:#666;--sidebar-w:230px;--topbar-h:60px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--cream);font-family:'DM Sans',-apple-system,sans-serif;line-height:1.55;min-height:100vh;font-size:14px}
.h{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:500;color:var(--cream);letter-spacing:-0.01em}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:0.04em}
.eyebrow{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold)}
a{color:inherit;text-decoration:none}
#gate{padding:80px 24px;max-width:480px;margin:0 auto;text-align:center}
#gate h2{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:24px;margin-bottom:14px}
#gate p{color:rgba(232,227,216,0.7);margin-bottom:20px;font-size:14px}
#gate input{display:block;margin:14px auto;padding:11px 14px;border:1px solid rgba(232,227,216,0.2);background:var(--navy2);color:var(--cream);border-radius:8px;font-family:'JetBrains Mono',ui-monospace,monospace;width:100%;font-size:13px}
#gate button{padding:11px 22px;background:var(--gold);color:var(--navy);border:none;border-radius:8px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif}
#gate button:hover{background:#deb588}
#shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
@media(max-width:760px){#shell{grid-template-columns:1fr}#sidebar{display:none}}
#sidebar{background:var(--navy2);border-right:1px solid rgba(232,227,216,0.08);padding:22px 14px;height:100vh;position:sticky;top:0;overflow-y:auto}
.brand{padding:0 10px 22px;border-bottom:1px solid rgba(232,227,216,0.08);margin-bottom:18px}
.brand-name{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:18px;color:var(--cream)}
.brand-name span{color:var(--blue-gray)}
.brand-sub{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.nav-section{margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;cursor:pointer;color:rgba(232,227,216,0.75);font-size:13px;font-weight:500;transition:all 0.12s}
.nav-item:hover{background:rgba(232,227,216,0.04);color:var(--cream)}
.nav-item.active{background:rgba(212,165,116,0.12);color:var(--gold)}
.nav-icon{font-size:15px;line-height:1;width:20px;text-align:center}
.nav-sub{margin:4px 0 8px 32px;display:none}
.nav-section.open .nav-sub{display:block}
.sub-item{padding:6px 10px;border-radius:6px;cursor:pointer;color:rgba(232,227,216,0.6);font-size:12px;transition:all 0.12s;display:flex;align-items:center;gap:8px}
.sub-item:hover{color:var(--cream);background:rgba(232,227,216,0.03)}
.sub-item.active{color:var(--gold);background:rgba(212,165,116,0.06)}
.sub-dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0.5}
.sub-item.active .sub-dot{opacity:1}
#main{display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
#topbar{height:var(--topbar-h);padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(232,227,216,0.08);background:var(--navy);position:sticky;top:0;z-index:10}
.crumbs{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:rgba(232,227,216,0.5);letter-spacing:0.06em}
.crumbs .current{color:var(--cream);font-weight:500}
.crumbs .sep{color:rgba(232,227,216,0.3)}
.topbar-right{display:flex;align-items:center;gap:16px;font-size:12px;color:rgba(232,227,216,0.55);font-family:'JetBrains Mono',ui-monospace,monospace}
#content{padding:28px 32px 64px;max-width:1400px;width:100%}
.section-head{margin-bottom:24px}
.section-head h1{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:500;font-size:28px;color:var(--cream);margin-bottom:6px}
.section-head .desc{font-size:14px;color:rgba(232,227,216,0.65)}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:28px}
@media(min-width:720px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stats-grid-3{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
@media(min-width:720px){.stats-grid-3{grid-template-columns:repeat(3,1fr)}}
.stat{padding:16px 18px;border:1px solid rgba(232,227,216,0.12);border-radius:11px;background:var(--navy2)}
.stat-label{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(232,227,216,0.5);margin-bottom:8px}
.stat-value{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:500;font-size:28px;color:var(--cream);line-height:1}
.stat-value.hot{color:var(--hot)}.stat-value.warm{color:var(--warm)}.stat-value.cool{color:var(--cool)}.stat-value.success{color:var(--success)}
.stat-sub{font-size:11px;color:rgba(232,227,216,0.5);font-family:'JetBrains Mono',ui-monospace,monospace;margin-top:6px;letter-spacing:0.04em}
.filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:5px 12px;border:1px solid rgba(232,227,216,0.16);background:transparent;color:rgba(232,227,216,0.75);border-radius:999px;font-size:11px;cursor:pointer;font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:0.08em;text-transform:uppercase;transition:all 0.12s}
.filter-btn:hover{border-color:rgba(232,227,216,0.34)}
.filter-btn.active{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.filter-spacer{flex:1}
.filter-meta{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;color:rgba(232,227,216,0.5);letter-spacing:0.08em}
.search-input{padding:5px 12px;border:1px solid rgba(232,227,216,0.16);background:var(--navy2);color:var(--cream);border-radius:999px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;min-width:220px}
.row-list{display:flex;flex-direction:column;gap:8px}
.row{padding:14px 18px;border:1px solid rgba(232,227,216,0.12);border-radius:10px;background:var(--navy2);display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;transition:all 0.12s}
.row:hover{border-color:rgba(232,227,216,0.24);background:var(--navy3)}
.row.hot{border-left:3px solid var(--hot)}.row.warm{border-left:3px solid var(--warm)}.row.cool{border-left:3px solid var(--cool)}.row.cold{border-left:3px solid var(--cold)}
.row.pending{border-left:3px solid var(--warn)}.row.approved{border-left:3px solid var(--success)}.row.rejected{border-left:3px solid var(--coral)}
.row-badge{display:flex;flex-direction:column;align-items:center;min-width:60px;gap:4px}
.row-badge-icon{font-size:22px;line-height:1}
.row-badge-text{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:0.04em}
.row-main h3{font-size:14px;font-weight:500;margin-bottom:3px;color:var(--cream)}
.row-main h3 .meta{color:rgba(232,227,216,0.5);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:0.06em;margin-left:6px;font-weight:400}
.row-main .sub{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;color:rgba(232,227,216,0.5);margin-bottom:5px;letter-spacing:0.04em}
.row-main .details{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:rgba(232,227,216,0.7);font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:0.04em}
.row-main .details strong{color:var(--cream);font-weight:500}
.row-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;min-width:110px}
.row-actions .age{font-size:10px;color:rgba(232,227,216,0.45);font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:0.04em}
.row-actions .action-row{display:flex;gap:6px}
.btn{padding:5px 11px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;border-radius:6px;cursor:pointer;border:1px solid rgba(232,227,216,0.18);background:transparent;color:var(--cream);transition:all 0.12s;display:inline-block;text-decoration:none}
.btn:hover{border-color:rgba(232,227,216,0.4);background:rgba(232,227,216,0.04)}
.btn.primary{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:500}
.btn.primary:hover{background:#deb588;border-color:#deb588}
.btn.success{background:var(--success);color:var(--navy);border-color:var(--success)}
.btn.success:hover{background:#a3cb8a;border-color:#a3cb8a}
.btn.danger{background:transparent;color:var(--coral);border-color:rgba(201,120,101,0.4)}
.btn.danger:hover{background:rgba(201,120,101,0.08);border-color:var(--coral)}
.empty{padding:48px 24px;text-align:center;color:rgba(232,227,216,0.5);font-size:14px;font-style:italic;border:1px dashed rgba(232,227,216,0.16);border-radius:12px}
.placeholder-section{padding:60px 40px;text-align:center;border:1px dashed rgba(212,165,116,0.3);border-radius:14px;background:rgba(212,165,116,0.03)}
.placeholder-section h2{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:22px;color:var(--cream);margin-bottom:12px}
.placeholder-section p{color:rgba(232,227,216,0.65);font-size:14px;margin-bottom:18px}
.sprint-tag{display:inline-block;padding:5px 14px;background:rgba(212,165,116,0.12);border:1px solid rgba(212,165,116,0.3);border-radius:999px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold)}
#toast{position:fixed;bottom:24px;right:24px;padding:13px 20px;background:var(--navy2);border:1px solid var(--gold);border-radius:10px;color:var(--cream);font-size:13px;font-family:'JetBrains Mono',ui-monospace,monospace;z-index:1000;max-width:360px;display:none}
#toast.show{display:block;animation:slidein 0.2s ease}
#toast.success{border-color:var(--success);color:var(--success)}
#toast.error{border-color:var(--coral);color:var(--coral)}
@keyframes slidein{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.events-table{width:100%;border-collapse:collapse;font-size:12px}
.events-table th{text-align:left;padding:10px 12px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(232,227,216,0.5);border-bottom:1px solid rgba(232,227,216,0.12);background:var(--navy2);font-weight:500}
.events-table td{padding:11px 12px;border-bottom:1px solid rgba(232,227,216,0.06);vertical-align:top;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.03em}
.events-table tr:hover td{background:rgba(232,227,216,0.025)}
.evtype{color:var(--gold)}
.evmeta{color:rgba(232,227,216,0.55);font-size:10px;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shortcut-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:28px}
@media(min-width:720px){.shortcut-grid{grid-template-columns:1fr 1fr}}
.shortcut-card{padding:20px 22px;border:1px solid rgba(232,227,216,0.12);border-radius:12px;background:var(--navy2)}
.shortcut-card h3{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:16px;color:var(--cream);margin-bottom:8px}
.shortcut-card .meta{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:rgba(232,227,216,0.65);line-height:1.7;letter-spacing:0.03em}
.shortcut-card .meta strong{color:var(--cream);font-weight:500}
.shortcut-card .actions{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
</style>
</head>
<body>

<div id="gate">
  <h2>Admin sign-in</h2>
  <p>Sign in with your admin account to access the dashboard.</p>
  <div id="gate-content"><p style="font-size:13px;color:rgba(232,227,216,0.6);margin-bottom:14px">Loading…</p></div>
</div>

<div id="shell" style="display:none">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-name">Condo <span>Market</span></div>
      <div class="brand-sub">Admin · v2</div>
    </div>
    <div class="nav-section" data-section="dashboard"><div class="nav-item" data-route="dashboard"><span class="nav-icon">🏠</span><span>Dashboard</span></div></div>
    <div class="nav-section" data-section="listings">
      <div class="nav-item" data-route="listings"><span class="nav-icon">📋</span><span>Listings</span></div>
      <div class="nav-sub">
        <div class="sub-item" data-route="listings/pipeline"><span class="sub-dot"></span>Pipeline</div>
        <div class="sub-item" data-route="listings/owners"><span class="sub-dot"></span>Owners</div>
        <div class="sub-item" data-route="listings/active"><span class="sub-dot"></span>Active deals</div>
        <div class="sub-item" data-route="listings/events"><span class="sub-dot"></span>Funnel events</div>
      </div>
    </div>
    <div class="nav-section" data-section="buyers">
      <div class="nav-item" data-route="buyers"><span class="nav-icon">👥</span><span>Buyers</span></div>
      <div class="nav-sub">
        <div class="sub-item" data-route="buyers/pool"><span class="sub-dot"></span>Pool</div>
        <div class="sub-item" data-route="buyers/watchlists"><span class="sub-dot"></span>Watchlists</div>
        <div class="sub-item" data-route="buyers/offers"><span class="sub-dot"></span>Offers</div>
        <div class="sub-item" data-route="buyers/appointments"><span class="sub-dot"></span>Appointments</div>
      </div>
    </div>
    <div class="nav-section" data-section="partnerships"><div class="nav-item" data-route="partnerships"><span class="nav-icon">🤝</span><span>Partnerships</span></div></div>
    <div class="nav-section" data-section="acquisition"><div class="nav-item" data-route="acquisition"><span class="nav-icon">📡</span><span>Acquisition</span></div></div>
    <div class="nav-section" data-section="ops"><div class="nav-item" data-route="ops"><span class="nav-icon">⚙</span><span>Operations</span></div></div>
  </aside>
  <div id="main">
    <header id="topbar">
      <div class="crumbs" id="crumbs"><span class="current">Dashboard</span></div>
      <div class="topbar-right"><span id="user-info"></span><span id="updated"></span></div>
    </header>
    <section id="content"></section>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPA_URL = 'https://kfqphwerygccpzntbbif.supabase.co';
const SUPA_ANON = window.CMSF_ANON_KEY || localStorage.getItem('cms_admin_anon_key_v1') || '';
const sb = createClient(SUPA_URL, SUPA_ANON);
window.sb = sb;

let currentUser = null;
let sectionRefreshTimer = null;

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtMoney(n){if(!n)return'—';if(n>=1000000)return'$'+(n/1000000).toFixed(2).replace(/\.?0+$/,'')+'M';if(n>=1000)return'$'+Math.round(n/1000)+'K';return'$'+n}
function fmtDuration(s){if(!s)return'—';if(s<60)return s+'s';const m=Math.floor(s/60),sec=s%60;if(m<60)return sec?`${m}m ${sec}s`:`${m}m`;const h=Math.floor(m/60);return`${h}h ${m%60}m`}
function fmtAge(t){if(!t)return'—';const s=Math.round((Date.now()-new Date(t).getTime())/1000);if(s<60)return s+'s ago';if(s<3600)return Math.round(s/60)+'m ago';if(s<86400)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago'}
function prettyBuilding(slug){if(!slug)return'—';return String(slug).replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function toast(msg,type='info'){const t=document.getElementById('toast');t.textContent=msg;t.className='show '+type;setTimeout(()=>t.className='',3500)}
function setUpdated(){document.getElementById('updated').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}

const tempEmoji={hot:'🔥',warm:'🌡',cool:'❄',cold:'·'};

async function bootstrap() {
  if (!SUPA_ANON) {
    document.getElementById('gate-content').innerHTML = `<p style="color:var(--coral);font-size:13px">No anon key found.</p><input type="password" id="key-input" placeholder="anon key"><button id="key-save">Save key</button>`;
    document.getElementById('key-save').addEventListener('click', () => { const k=document.getElementById('key-input').value.trim(); if(k){localStorage.setItem('cms_admin_anon_key_v1',k);location.reload()}});
    return;
  }
  const { data: { user } } = await sb.auth.getUser();
  if (!user) {
    document.getElementById('gate-content').innerHTML = `<p style="font-size:13px;color:rgba(232,227,216,0.7)">You're not signed in. Sign in to your admin account first.</p><button onclick="location.href='/account/signin/?redirect=/admin/'">Sign in →</button>`;
    return;
  }
  const { data: profile, error } = await sb.from('profiles').select('id,full_name,role,email').eq('id', user.id).maybeSingle();
  if (error || !profile || profile.role !== 'admin') {
    document.getElementById('gate-content').innerHTML = `<p style="color:var(--coral);font-size:13px">Your account doesn't have admin role.</p><button id="signout-btn">Sign out</button>`;
    document.getElementById('signout-btn').addEventListener('click', async () => { await sb.auth.signOut(); location.href='/account/signin/?redirect=/admin/'; });
    return;
  }
  currentUser = profile;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('shell').style.display = 'grid';
  document.getElementById('user-info').textContent = profile.full_name || profile.email;
  document.querySelectorAll('[data-route]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); location.hash = '#' + el.dataset.route; }));
  window.addEventListener('hashchange', handleHashChange);
  handleHashChange();
}

function handleHashChange() {
  const hash = (location.hash || '#dashboard').slice(1);
  if (sectionRefreshTimer) { clearInterval(sectionRefreshTimer); sectionRefreshTimer = null; }
  document.querySelectorAll('.nav-section').forEach(s => s.classList.remove('open'));
  document.querySelectorAll('[data-route]').forEach(el => el.classList.remove('active'));
  const [topSection, subSection] = hash.split('/');
  const topEl = document.querySelector(`.nav-section[data-section="${topSection}"]`);
  if (topEl) { topEl.classList.add('open'); topEl.querySelector('[data-route]').classList.add('active'); }
  if (subSection) { const subEl = document.querySelector(`[data-route="${topSection}/${subSection}"]`); if (subEl) subEl.classList.add('active'); }
  const sectionName = { dashboard:'Dashboard', listings:'Listings', buyers:'Buyers', partnerships:'Partnerships', acquisition:'Acquisition', ops:'Operations' }[topSection] || 'Admin';
  const subName = { pipeline:'Pipeline', owners:'Owners', active:'Active deals', events:'Funnel events', pool:'Pool', watchlists:'Watchlists', offers:'Offers', appointments:'Appointments' }[subSection];
  document.getElementById('crumbs').innerHTML = subName ? `<span>${sectionName}</span><span class="sep">/</span><span class="current">${subName}</span>` : `<span class="current">${sectionName}</span>`;
  document.getElementById('content').innerHTML = '<div class="empty">Loading…</div>';
  const renderers = { 'dashboard':renderDashboard, 'listings':()=>{location.hash='#listings/pipeline'}, 'listings/pipeline':renderListingsPipeline, 'listings/owners':renderListingsOwners, 'listings/active':renderListingsActive, 'listings/events':renderListingsEvents, 'buyers':()=>{location.hash='#buyers/pool'}, 'buyers/pool':renderBuyersPool, 'buyers/watchlists':renderBuyersWatchlists, 'buyers/offers':renderBuyersOffers, 'buyers/appointments':renderBuyersAppointments, 'partnerships':renderPartnershipsStub, 'acquisition':renderAcquisitionStub, 'ops':renderOpsStub };
  (renderers[hash] || renderers['dashboard'])();
}

// ---------- DASHBOARD v2 ----------
async function renderDashboard() {
  document.getElementById('content').innerHTML = `
    <div class="section-head">
      <div class="eyebrow" style="margin-bottom:6px">Today, ${new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}</div>
      <h1>Morning briefing</h1>
      <div class="desc">What's happening across the business and what needs your attention. Auto-refreshes every 30 seconds.</div>
    </div>
    <div id="dash-content"><div class="empty">Loading…</div></div>`;
  await loadDashboard();
  sectionRefreshTimer = setInterval(loadDashboard, 30000);
}

async function loadDashboard() {
  const startOfToday = new Date(); startOfToday.setHours(0,0,0,0);
  const startIso = startOfToday.toISOString();
  const last24hIso = new Date(Date.now() - 86400*1000).toISOString();

  const [
    scoreRes, claimsAll, listingsAll, partnersDue,
    mmmActive, watchlistCount, offersCount, apptsCount, hoaCount, peopleCount,
    todaySent, todayOpens, todayClicks,
    lifetimeUnsubs, lifetimeBounces, lifetimeInvites,
    feedRecent
  ] = await Promise.all([
    sb.from('v_seller_intent_scores').select('temperature').then(r => r.data || []),

function renderActivityFeed(rows) {
  if (!rows.length) return '<div class="empty">No email activity in the last 24 hours.</div>';
  // Sort by max(sent_at, opened_at, first_clicked_at) DESC
  const eventTime = r => Math.max(
    r.sent_at ? new Date(r.sent_at).getTime() : 0,
    r.opened_at ? new Date(r.opened_at).getTime() : 0,
    r.first_clicked_at ? new Date(r.first_clicked_at).getTime() : 0
  );
  const sorted = [...rows].sort((a,b) => eventTime(b) - eventTime(a)).slice(0, 20);
  return `<div class="row-list">${sorted.map(r => {
    const events = [];
    const eventTimes = [
      { ts: r.first_clicked_at, label: 'clicked', color: 'gold', icon: '🖱' },
      { ts: r.opened_at, label: 'opened', color: 'success', icon: '👁' },
      { ts: r.sent_at, label: 'sent', color: 'cool', icon: '📤' }
    ].filter(e => e.ts);
    eventTimes.forEach(e => {
      events.push(`<span style="color:var(--${e.color})">✓ ${e.label}</span> ${escapeHtml(fmtAge(e.ts))}`);
    });
    const topEvent = eventTimes[0];
    const eventClass = topEvent.label === 'clicked' ? 'hot' : (topEvent.label === 'opened' ? 'warm' : 'cool');
    const icon = topEvent.icon;
    const clickedUrl = r.last_clicked_url ? r.last_clicked_url.replace(/^https?:\/\/[^/]+/, '').replace('?ref=oos_invite','') : '';
    return `<div class="row ${eventClass}">
      <div class="row-badge"><div class="row-badge-icon">${icon}</div><div class="row-badge-text">${escapeHtml(topEvent.label)}</div></div>
      <div class="row-main">
        <h3>${escapeHtml(r.email)}<span class="meta">${escapeHtml(r.template_slug || '—')}</span></h3>
        <div class="details">${events.join('<span style="opacity:0.4">·</span>')}${clickedUrl ? `<span style="opacity:0.4">·</span><span>→ <strong>${escapeHtml(clickedUrl)}</strong></span>` : ''}</div>
      </div>
      <div class="row-actions"><div class="action-row"><a href="mailto:${r.email}" class="btn primary">Email →</a></div></div>
    </div>`;
  }).join('')}</div>`;
}

async function loadOwners() {
  const { data: claims, error } = await sb.from('user_units').select('*').order('created_at', { ascending: false });
  if (error) { document.getElementById('own-list').innerHTML = `<div class="empty">Error: ${escapeHtml(error.message)}</div>`; return; }
  const userIds = [...new Set((claims||[]).map(c => c.user_id))];
  const bldgSlugs = [...new Set((claims||[]).map(c => c.building_slug).filter(Boolean))];
  const [profilesRes, mmmRes, bldgRes] = await Promise.all([
    sb.from('profiles').select('id,full_name,email').in('id', userIds.length ? userIds : ['00000000-0000-0000-0000-000000000000']),
    sb.from('make_me_move').select('user_id,building_slug,unit_address,target_price,is_active'),
    sb.from('buildings').select('slug,display_name,neighborhood').in('slug', bldgSlugs.length ? bldgSlugs : ['__none__'])
  ]);
  const profileMap = Object.fromEntries((profilesRes.data || []).map(p => [p.id, p]));
  const mmmMap = Object.fromEntries((mmmRes.data || []).map(m => [`${m.user_id}|${m.building_slug}|${m.unit_address}`, m]));
  const bldgMap = Object.fromEntries((bldgRes.data || []).map(b => [b.slug, b]));
  window._allOwners = (claims || []).map(c => ({ ...c, profile: profileMap[c.user_id], mmm: mmmMap[`${c.user_id}|${c.building_slug}|${c.unit_address}`], building: bldgMap[c.building_slug] }));
  const active = document.querySelector('#content .filter-btn.active')?.dataset.filter || 'all';
  renderOwnersList(window._allOwners, active);
  setUpdated();
}

function renderOwnersList(allOwners, filter) {
  let owners = allOwners;
  if (filter !== 'all') owners = owners.filter(o => o.status === filter);
  owners = [...owners].sort((a, b) => {
    if (a.status === 'pending' && b.status !== 'pending') return -1;
    if (b.status === 'pending' && a.status !== 'pending') return 1;
    return new Date(b.created_at) - new Date(a.created_at);
  });
  document.getElementById('own-count').textContent = owners.length + ' owner' + (owners.length===1?'':'s');
  if (!owners.length) { document.getElementById('own-list').innerHTML = '<div class="empty">No claims match this filter.</div>'; return; }
  document.getElementById('own-list').innerHTML = `<div class="row-list">${owners.map(o => {
    const bldgName = o.building?.display_name || prettyBuilding(o.building_slug);
    const statusIcon = { pending:'⏳', approved:'✓', rejected:'✕' }[o.status] || '·';
    const statusColor = { pending:'warn', approved:'success', rejected:'coral' }[o.status] || 'cool';
    const parts = [];
    if (o.mmm?.target_price) parts.push(`<span>MMM <strong>${fmtMoney(o.mmm.target_price)}</strong>${o.mmm.is_active ? ' active' : ' inactive'}</span>`);
    if (o.building?.neighborhood) parts.push(`<span>${o.building.neighborhood}</span>`);
    if (o.claimed_name && o.claimed_name !== o.profile?.full_name) parts.push(`<span>claimed: <strong>${escapeHtml(o.claimed_name)}</strong></span>`);
    const actions = o.status === 'pending' 
      ? `<button class="btn success" data-act="approve" data-id="${o.id}">Approve</button><button class="btn danger" data-act="reject" data-id="${o.id}">Reject</button>`
      : `<a class="btn" href="mailto:${o.profile?.email || ''}">Email →</a>`;
    return `<div class="row ${o.status}">
      <div class="row-badge"><div class="row-badge-icon">${statusIcon}</div><div class="row-badge-text" style="color:var(--${statusColor})">${o.status}</div></div>
      <div class="row-main">
        <h3>${escapeHtml(o.profile?.full_name || o.claimed_name || o.profile?.email?.split('@')[0] || 'Unknown')}<span class="meta">${escapeHtml(bldgName)} · #${escapeHtml(o.unit_address || '')}</span></h3>
        <div class="sub">${escapeHtml(o.profile?.email || '')}</div>
        <div class="details">${parts.join('<span style="opacity:0.4">·</span>') || '<span style="color:rgba(232,227,216,0.4)">no MMM yet</span>'}</div>
      </div>
      <div class="row-actions"><div class="age">claimed ${fmtAge(o.created_at)}</div><div class="action-row">${actions}</div></div>
    </div>`;
  }).join('')}</div>`;
  document.querySelectorAll('[data-act]').forEach(btn => btn.addEventListener('click', async () => {
    const act = btn.dataset.act, id = btn.dataset.id;
    if (act === 'approve') {
      if (!confirm('Approve this claim? This activates the owner\'s Make Me Move price and unlocks petition signing.')) return;
      const { error } = await sb.from('user_units').update({ status: 'approved' }).eq('id', id);
      if (error) return toast('Approve failed: ' + error.message, 'error');
      toast('Claim approved ✓', 'success');
    } else if (act === 'reject') {
      if (!confirm('Reject this claim? The owner will be notified and the unit will go back to unclaimed.')) return;
      const { error } = await sb.from('user_units').update({ status: 'rejected' }).eq('id', id);
      if (error) return toast('Reject failed: ' + error.message, 'error');
      toast('Claim rejected', 'success');
    }
    await loadOwners();
  }));
}

    const parts = [];
    if (d.price) parts.push(`<span>at <strong>${fmtMoney(d.price)}</strong></span>`);
    if (d.occupancy_mode) parts.push(`<span>${d.occupancy_mode.replace('_',' ')}</span>`);

    parts.push(signed ? `<span style="color:var(--success)">✓ signed ${fmtAge(d.agreement_signed_at)}</span>` : `<span style="color:var(--warn)">⏳ awaiting signature</span>`);
    const actions = signed ? `<a class="btn" href="mailto:${d.profile?.email || ''}">Email owner</a>` : `<button class="btn primary" data-sign="${d.id}">Mark signed</button>`;
    return `<div class="row ${signed ? 'approved' : 'pending'}">
      <div class="row-badge"><div class="row-badge-icon">${tierIcon}</div><div class="row-badge-text">${escapeHtml(tierLabel)}</div></div>
      <div class="row-main">
        <h3>${escapeHtml(d.profile?.full_name || d.profile?.email?.split('@')[0] || 'Unknown')}<span class="meta">${escapeHtml(bldgName)} · #${escapeHtml(d.unit_address || '')}</span></h3>
        <div class="sub">${escapeHtml(d.profile?.email || '')}</div>
        <div class="details">${parts.join('<span style="opacity:0.4">·</span>')}</div>
      </div>
      <div class="row-actions"><div class="age">updated ${fmtAge(d.updated_at)}</div><div class="action-row">${actions}</div></div>
    </div>`;
  }).join('')}</div>`;
  document.querySelectorAll('[data-sign]').forEach(btn => btn.addEventListener('click', async () => {
    const id = btn.dataset.sign;
    const url = prompt('Optional: paste the agreement URL (DocuSign link, etc.). Leave blank to mark signed without URL.');
    if (url === null) return;
    const update = { agreement_signed_at: new Date().toISOString() };
    if (url) update.agreement_url = url;
    const { error } = await sb.from('listings').update(update).eq('id', id);
    if (error) return toast('Mark signed failed: ' + error.message, 'error');
    toast('Agreement marked signed ✓', 'success');
    await loadActive();
  }));
}

async function loadPool() {
  const [watches, offersData, apptsData, profilesData] = await Promise.all([
    sb.from('watchlist').select('id,user_id,building_slug,created_at'),
    sb.from('offers').select('*'),
    sb.from('appointments').select('*'),
    sb.from('profiles').select('id,email,full_name,phone,tos_accepted_at')
  ]);
  const profileMap = Object.fromEntries((profilesData.data||[]).map(p => [p.id, p]));
  const pool = new Map();
  const upsert = (key, init) => { if (!pool.has(key)) pool.set(key, init); return pool.get(key); };

  for (const w of (watches.data||[])) {
    const profile = profileMap[w.user_id];
    if (!profile) continue;
    const p = upsert(profile.email.toLowerCase(), { email: profile.email, name: profile.full_name, user_id: w.user_id, phone: profile.phone, tos: profile.tos_accepted_at, watchlist: [], offers: [], appointments: [], last_activity: null });
    p.watchlist.push(w);
    if (!p.last_activity || w.created_at > p.last_activity) p.last_activity = w.created_at;
  }
  for (const o of (offersData.data||[])) {
    if (!o.buyer_email) continue;
    const profile = o.buyer_user_id ? profileMap[o.buyer_user_id] : null;
    const p = upsert(o.buyer_email.toLowerCase(), { email: o.buyer_email, name: profile?.full_name || o.buyer_name, user_id: o.buyer_user_id, phone: profile?.phone, tos: profile?.tos_accepted_at, watchlist: [], offers: [], appointments: [], last_activity: null });
    p.offers.push(o);
    if (!p.last_activity || o.created_at > p.last_activity) p.last_activity = o.created_at;
  }
  for (const a of (apptsData.data||[])) {
    if (!a.prospect_email) continue;
    const p = upsert(a.prospect_email.toLowerCase(), { email: a.prospect_email, name: a.prospect_name, user_id: null, phone: a.prospect_phone, tos: null, watchlist: [], offers: [], appointments: [], last_activity: null });
    p.appointments.push(a);
    if (!p.last_activity || a.created_at > p.last_activity) p.last_activity = a.created_at;
  }

  window._allPool = Array.from(pool.values());
  const totalBuyers = window._allPool.length;
  const withOffer = window._allPool.filter(b => b.offers.length > 0).length;
  const withAppt = window._allPool.filter(b => b.appointments.length > 0).length;
  const verified = window._allPool.filter(b => b.tos).length;
  document.getElementById('buyer-stats').innerHTML = `
    <div class="stat"><div class="stat-label">👥 Buyers</div><div class="stat-value">${totalBuyers}</div></div>
    <div class="stat"><div class="stat-label">💵 With offer</div><div class="stat-value warm">${withOffer}</div></div>
    <div class="stat"><div class="stat-label">📅 Booked appt</div><div class="stat-value cool">${withAppt}</div></div>
    <div class="stat"><div class="stat-label">✓ TOS accepted</div><div class="stat-value success">${verified}</div></div>`;
  const active = document.querySelector('#content .filter-btn.active')?.dataset.filter || 'all';
  renderPoolList(window._allPool, active);
  setUpdated();
}

function renderPoolList(allBuyers, filter) {
  let buyers = [...allBuyers];
  if (filter === 'offer') buyers = buyers.filter(b => b.offers.length > 0);
  else if (filter === 'appointment') buyers = buyers.filter(b => b.appointments.length > 0);
  else if (filter === 'active30d') { const c = Date.now() - 30*86400*1000; buyers = buyers.filter(b => b.last_activity && new Date(b.last_activity).getTime() > c); }
  buyers.sort((a,b) => new Date(b.last_activity) - new Date(a.last_activity));
  document.getElementById('buyer-count').textContent = buyers.length + ' buyer' + (buyers.length===1?'':'s');
  if (!buyers.length) { document.getElementById('buyer-list').innerHTML = '<div class="empty">No buyers match this filter. Buyers appear here when they watch a building, make an offer, or book an appointment.</div>'; return; }
  document.getElementById('buyer-list').innerHTML = `<div class="row-list">${buyers.map(b => {
    const parts = [];
    if (b.watchlist.length) parts.push(`<span>👁 ${b.watchlist.length} watch${b.watchlist.length>1?'es':''}</span>`);
    if (b.offers.length) parts.push(`<span style="color:var(--warm)">💵 ${b.offers.length} offer${b.offers.length>1?'s':''}</span>`);
    if (b.appointments.length) parts.push(`<span style="color:var(--cool)">📅 ${b.appointments.length} appt${b.appointments.length>1?'s':''}</span>`);
    if (b.tos) parts.push(`<span style="color:var(--success)">✓ TOS</span>`);
    const buildings = [...new Set([...b.watchlist.map(w=>w.building_slug), ...b.offers.map(o=>o.building_slug), ...b.appointments.map(a=>a.building_slug)])].filter(Boolean);
    const buildingsStr = buildings.length ? buildings.slice(0,3).map(prettyBuilding).join(' · ') + (buildings.length>3 ? ` +${buildings.length-3}` : '') : '—';
    const tempClass = b.offers.length ? 'warm' : (b.appointments.length ? 'cool' : (b.watchlist.length ? 'cool' : 'cold'));
    return `<div class="row ${tempClass}">
      <div class="row-badge"><div class="row-badge-icon">👤</div></div>
      <div class="row-main">
        <h3>${escapeHtml(b.name || b.email.split('@')[0])}<span class="meta">${escapeHtml(buildingsStr)}</span></h3>
        <div class="sub">${escapeHtml(b.email)}${b.phone ? ` · ${escapeHtml(b.phone)}` : ''}</div>
        <div class="details">${parts.join('<span style="opacity:0.4">·</span>')}</div>
      </div>
      <div class="row-actions"><div class="age">${fmtAge(b.last_activity)}</div><div class="action-row"><a href="mailto:${b.email}" class="btn primary">Email →</a></div></div>
    </div>`;
  }).join('')}</div>`;
}

  if (filter === 'upcoming') appts = appts.filter(a => new Date(a.scheduled_for).getTime() > now && !a.cancelled_at);
  else if (filter === 'past') appts = appts.filter(a => new Date(a.scheduled_for).getTime() <= now && !a.cancelled_at);
  else if (filter === 'cancelled') appts = appts.filter(a => a.cancelled_at);
  document.getElementById('appt-count').textContent = appts.length + ' appt' + (appts.length===1?'':'s');
  if (!appts.length) { document.getElementById('appt-list').innerHTML = '<div class="empty">No appointments match. When prospects book via the site, they appear here.</div>'; return; }
  document.getElementById('appt-list').innerHTML = `<div class="row-list">${appts.map(a => {
    const when = new Date(a.scheduled_for);
    const isUpcoming = when.getTime() > now && !a.cancelled_at;
    const statusClass = a.cancelled_at ? 'rejected' : (isUpcoming ? 'warm' : 'cool');
    const parts = [];
    parts.push(`<span>${escapeHtml(a.appointment_type || 'meeting')}</span>`);
    if (a.duration_minutes) parts.push(`<span>${a.duration_minutes}min</span>`);
    if (a.timezone) parts.push(`<span>${escapeHtml(a.timezone)}</span>`);
    if (a.source_campaign) parts.push(`<span>via ${escapeHtml(a.source_campaign)}</span>`);
    return `<div class="row ${statusClass}">
      <div class="row-badge"><div class="row-badge-icon">📅</div><div class="row-badge-text">${escapeHtml(a.status || (isUpcoming ? 'upcoming' : 'past'))}</div></div>
      <div class="row-main">
        <h3>${escapeHtml(a.prospect_name || a.prospect_email)}<span class="meta">→ ${escapeHtml(a.property_address || prettyBuilding(a.building_slug))}</span></h3>
        <div class="sub">${escapeHtml(a.prospect_email)}${a.prospect_phone ? ` · ${escapeHtml(a.prospect_phone)}` : ''}</div>
        <div class="details">${parts.join('<span style="opacity:0.4">·</span>')}</div>
        ${a.prospect_notes ? `<div style="margin-top:6px;font-size:12px;color:rgba(232,227,216,0.65);font-style:italic">"${escapeHtml(a.prospect_notes.substring(0,200))}${a.prospect_notes.length>200?'…':''}"</div>` : ''}
      </div>
      <div class="row-actions"><div class="age">${when.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div><div class="action-row">${a.google_meet_link ? `<a class="btn primary" href="${escapeHtml(a.google_meet_link)}" target="_blank">Join Meet →</a>` : `<a class="btn" href="mailto:${a.prospect_email}">Email →</a>`}</div></div>
    </div>`;
  }).join('')}</div>`;
}
