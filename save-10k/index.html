<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Save $10,000 · San Francisco Condo Market</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1115;--card:#171a20;--border:rgba(232,227,216,0.10);--rule:rgba(232,227,216,0.10);--text:#e8e3d8;--text-dim:rgba(232,227,216,0.75);--text-faint:rgba(232,227,216,0.45);--gold:#d4a574;--green:#8fb97a;--red:#c97865;--ff-display:'Playfair Display',Georgia,serif;--ff-body:'DM Sans',-apple-system,system-ui,sans-serif;--ff-mono:'JetBrains Mono',ui-monospace,monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--ff-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;}
@media(min-width:900px){body{padding-top:60px;background:radial-gradient(60% 50% at 50% 0%,rgba(212,165,116,0.06),transparent 70%),var(--bg);}}
.stage{width:100%;max-width:480px;position:relative;}
.topbar{display:flex;align-items:center;height:44px;margin-bottom:20px;}
.progress{display:flex;gap:6px;}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(232,227,216,0.15);transition:background .3s;}
.dot.on{background:var(--gold);}
.back{margin-left:auto;background:none;border:none;color:var(--text-dim);font-size:14px;font-family:inherit;padding:6px 10px;cursor:pointer;border-radius:6px;display:none;}
.back.on{display:inline-block;}
.back:hover{color:var(--text);}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 24px;animation:fadein 280ms ease;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.fatal{padding:18px;color:var(--red);font-family:var(--ff-mono);font-size:12px;line-height:1.5;word-break:break-word;white-space:pre-wrap;}
.eyebrow{font-family:var(--ff-mono);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;}
h1{font-family:var(--ff-display);font-weight:500;font-size:28px;line-height:1.15;margin-bottom:14px;letter-spacing:-0.01em;}
h1.sm{font-size:24px;}
h1 em{font-style:italic;color:var(--gold);}
p.body{font-size:15.5px;color:var(--text-dim);line-height:1.55;margin-bottom:18px;}
p.body strong{color:var(--text);font-weight:500;}
.btn{display:block;width:100%;height:52px;background:var(--gold);color:#1a1f2e;border:none;border-radius:999px;font-family:var(--ff-body);font-weight:600;font-size:15px;cursor:pointer;transition:opacity .15s,transform .15s;margin-top:8px;}
.btn:hover{opacity:.9;} .btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.tagline{margin-top:22px;font-size:13px;color:var(--text-faint);line-height:1.6;text-align:center;}
.tagline .sep{color:rgba(232,227,216,0.2);margin:0 8px;}
.bldg-card{background:rgba(212,165,116,0.06);border:1px solid rgba(212,165,116,0.30);border-radius:12px;padding:18px 20px;margin-bottom:18px;display:flex;align-items:center;gap:14px;}
.bldg-check{flex:none;width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;}
.bldg-name{font-family:var(--ff-display);font-style:italic;font-weight:500;font-size:18px;line-height:1.2;margin-bottom:2px;}
.bldg-meta{font-family:var(--ff-mono);font-size:11px;letter-spacing:0.05em;color:var(--text-dim);text-transform:uppercase;}
.wrong-link{background:none;border:none;color:var(--text-dim);font-size:13px;font-family:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-bottom:18px;padding:0;}
.wrong-link:hover{color:var(--gold);}
.picker{display:none;margin-bottom:18px;} .picker.on{display:block;}
.picker-input{width:100%;height:48px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:0 16px;color:var(--text);font-family:inherit;font-size:15px;margin-bottom:8px;}
.picker-input:focus{outline:none;border-color:var(--gold);}
.picker-results{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow-y:auto;}
.picker-row{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;cursor:pointer;text-align:left;font-family:inherit;color:var(--text);width:100%;}
.picker-row:hover{border-color:var(--gold);}
.pr-name{font-family:var(--ff-display);font-style:italic;font-size:16px;}
.pr-meta{font-family:var(--ff-mono);font-size:10px;letter-spacing:0.05em;text-transform:uppercase;color:var(--text-dim);margin-top:2px;}
.picker-empty{color:var(--text-faint);font-size:13px;padding:10px 0;text-align:center;}
.reveal-loading{text-align:center;padding:32px 0;color:var(--text-dim);font-size:14px;}
.reveal-big{text-align:center;margin:18px 0 12px;}
.reveal-ppsf{font-family:var(--ff-display);font-style:italic;font-weight:500;font-size:42px;color:var(--gold);line-height:1;}
.reveal-ppsf .unit{font-size:22px;color:var(--text-dim);font-style:normal;font-family:var(--ff-mono);}
.reveal-sub{font-family:var(--ff-mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-dim);margin-top:6px;}
.reveal-yoy{margin-top:14px;font-family:var(--ff-mono);font-size:13px;color:var(--green);letter-spacing:0.04em;}
.reveal-yoy.down{color:var(--red);}
.reveal-table{margin:24px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);}
.reveal-row{display:flex;justify-content:space-between;padding:10px 0;font-size:14px;}
.reveal-row + .reveal-row{border-top:1px solid var(--rule);}
.reveal-row .label{color:var(--text-dim);}
.reveal-row .value{font-family:var(--ff-mono);color:var(--text);}
.reveal-row.self .label{color:var(--text);font-weight:500;}
.reveal-row.self .value{color:var(--gold);font-weight:500;}
.reveal-verdict{text-align:center;font-size:15px;color:var(--text);line-height:1.5;margin:18px 0;}
.reveal-verdict b{color:var(--gold);font-weight:600;}
.reveal-source{text-align:center;font-family:var(--ff-mono);font-size:10.5px;letter-spacing:0.06em;color:var(--text-faint);}
.bullet-row{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule);align-items:flex-start;}
.bullet-row:last-of-type{border-bottom:none;}
.bullet-icon{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(212,165,116,0.10);border:1px solid rgba(212,165,116,0.25);display:flex;align-items:center;justify-content:center;font-size:16px;}
.bullet-text{font-size:14.5px;line-height:1.5;color:var(--text);padding-top:5px;}
.bullet-text b{color:var(--gold);font-weight:600;}
.s4-sub{margin-top:18px;text-align:center;font-style:italic;font-size:13.5px;color:var(--text-faint);}
.trust-statement{font-family:var(--ff-display);font-style:italic;font-size:20px;line-height:1.4;color:var(--text);margin:14px 0 16px;padding:18px;background:rgba(212,165,116,0.04);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;}
.trust-statement strong{color:var(--gold);font-weight:500;font-style:normal;}
.trust-icons{display:flex;gap:14px;margin:20px 0 8px;padding:14px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-family:var(--ff-mono);font-size:11px;letter-spacing:0.04em;color:var(--text-dim);flex-wrap:wrap;justify-content:center;}
.email-label{font-family:var(--ff-mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;display:block;}
.email-input{width:100%;height:52px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:0 16px;color:var(--text);font-family:inherit;font-size:16px;margin-bottom:8px;}
.email-input:focus{outline:none;border-color:var(--gold);}
.email-error{color:var(--red);font-size:13px;margin-bottom:10px;display:none;}
.email-error.on{display:block;}
.email-fine{margin-top:16px;font-size:12.5px;color:var(--text-faint);text-align:center;line-height:1.5;}
.sent-icon{width:56px;height:56px;border-radius:50%;background:rgba(143,185,122,0.12);border:1px solid rgba(143,185,122,0.35);color:var(--green);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:26px;}
.resend{background:none;border:none;color:var(--text-dim);font-family:inherit;font-size:13px;cursor:pointer;margin-top:14px;text-decoration:underline;text-underline-offset:3px;display:none;}
.resend.on{display:inline-block;}
.resend:hover{color:var(--gold);}
.ftr{margin:24px auto 0;text-align:center;color:var(--text-faint);font-size:11px;font-family:var(--ff-mono);letter-spacing:0.06em;}
</style>
</head>
<body>
<div class="stage">
  <div class="topbar">
    <div class="progress" id="progress"></div>
    <button class="back" id="back" type="button" aria-label="Back">‹ Back</button>
  </div>
  <div class="card" id="card"></div>
  <div class="ftr">SAN FRANCISCO CONDO MARKET · McMullen Properties · DRE #02016832</div>
</div>

<script type="module">
/* ------------ visible error reporting (the silent-failure killer) ------- */
function showFatal(msg) {
  const c = document.getElementById('card');
  if (!c) return;
  c.innerHTML = '<div class="fatal">save-10k error:\n\n' + String(msg).replace(/[<>]/g,'') + '\n\nOpen browser dev tools → Console for the full stack.</div>';
}
window.addEventListener('error', e => {
  console.error('[save-10k] error:', e);
  showFatal((e.message || 'unknown') + (e.filename ? '\n@ ' + e.filename + ':' + e.lineno : ''));
});
window.addEventListener('unhandledrejection', e => {
  console.error('[save-10k] unhandled rejection:', e.reason);
  showFatal('Unhandled promise rejection: ' + (e.reason?.message || e.reason));
});

/* ------------ imports ------------ */
import { sb } from '/assets/cm-supabase.js';

/* ------------ constants & helpers ------------ */
const TOTAL = 6;
const AMOUNT = '$10,000';

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const marketSlug = () => location.hostname.includes('siliconvalley') ? 'silicon-valley-condo-market' : 'san-francisco-condo-market';
const marketName = () => marketSlug().startsWith('silicon') ? 'Silicon Valley Condo Market' : 'San Francisco Condo Market';
const ppsf = n => n==null||isNaN(n) ? '—' : '$'+Math.round(Number(n)).toLocaleString('en-US');
const pctStr = n => { if (n==null||isNaN(n)) return ''; const a = Math.abs(n).toFixed(1).replace(/\.0$/,''); return (n>=0?'+':'−')+a+'%'; };
const isEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((s||'').trim());
function getVisitorToken() {
  let t = localStorage.getItem('cm_visitor_token');
  if (!t) { t = (crypto.randomUUID ? crypto.randomUUID() : 'v_'+Date.now()+'_'+Math.random().toString(36).slice(2)); localStorage.setItem('cm_visitor_token', t); }
  return t;
}

/* ------------ backend wrappers (all internally swallow errors) --------- */
function logEvent(type, metadata) {
  try {
    sb.rpc('log_funnel_event', {
      p_event_type: type,
      p_email: state.email || null,
      p_metadata: Object.assign({ market: marketSlug(), utm_campaign: state.utm.campaign, utm_content: state.utm.content }, metadata || {}),
      p_source: 'save-10k'
    }).catch(e => console.warn('[funnel]', type, e?.message));
  } catch (e) { console.warn('[funnel] sync', e); }
}
async function captureLead(intent) {
  if (!state.email) return;
  try {
    await sb.rpc('capture_lead', {
      p_email: state.email,
      p_building_slug: state.building && state.building.slug || null,
      p_intent: intent,
      p_source: 'save-10k',
      p_message: null
    });
  } catch (e) { console.warn('[capture_lead]', e?.message); }
}
async function searchBuildings(q) {
  try {
    const { data, error } = await sb.rpc('search_buildings_for_signup', {
      p_market_slug: marketSlug(), p_query: q || null, p_limit: 8
    });
    if (error) { console.warn('[search]', error.message); return []; }
    return data || [];
  } catch (e) { console.warn('[search]', e?.message); return []; }
}
async function fetchReport(slug) {
  try {
    const { data, error } = await sb.rpc('building_market_report', { p_building_slug: slug, p_radius_mi: 0.5 });
    if (error) { console.warn('[report]', error.message); return null; }
    return data;
  } catch (e) { console.warn('[report]', e?.message); return null; }
}

/* ------------ state ------------ */
const params = new URLSearchParams(location.search);
const state = {
  screen: 1, building: null, email: null, report: null, reportLoaded: false, emailSent: false,
  utm: { campaign: params.get('utm_campaign'), content: params.get('utm_content') }
};

/* ------------ routing + render ------------ */
function goTo(n) { if (n<1||n>TOTAL) return; state.screen = n; render(); window.scrollTo({top:0}); }

function render() {
  try {
    document.getElementById('progress').innerHTML = Array.from({length:TOTAL}, function(_, i){ return '<div class="dot' + (i < state.screen ? ' on' : '') + '"></div>'; }).join('');
    document.getElementById('back').classList.toggle('on', state.screen > 1 && !state.emailSent);
    const card = document.getElementById('card');
    card.innerHTML = '';
    const fn = SCREENS[state.screen];
    if (fn) fn(card);
  } catch (e) {
    console.error('[render] failed', e);
    showFatal('Render error on screen ' + state.screen + ': ' + (e.message || e));
  }
}

const SCREENS = {
  1: function(card) {
    const hook = state.building
      ? "What's your unit at <em>" + esc(state.building.display_name) + "</em> really worth right now?"
      : "What's your <em>San Francisco</em> condo really worth right now?";
    card.innerHTML =
      '<div class="eyebrow">San Francisco Condo Market</div>' +
      '<h1>' + hook + '</h1>' +
      '<p class="body">Sales last month. Premium versus surrounding blocks. And a <strong>' + AMOUNT + ' credit</strong> you can lock in — saved to your account, applied whenever you sell or buy.</p>' +
      '<button class="btn" id="s1-next">See my building →</button>' +
      '<div class="tagline">Takes about 60 seconds.<br><span class="sep">·</span> We will never call you. <span class="sep">·</span></div>';
    document.getElementById('s1-next').onclick = function(){ goTo(2); };
  },

  2: function(card) {
    const b = state.building;
    const meta = b ? [b.neighborhood, b.city_name].filter(Boolean).join(' · ') : '';
    card.innerHTML =
      '<div class="eyebrow">Step 1 of 5</div>' +
      '<h1 class="sm">Confirm your <em>building</em></h1>' +
      '<p class="body">We\'ll use this to pull your live market data.</p>' +
      (b ? (
        '<div class="bldg-card">' +
          '<div class="bldg-check">✓</div>' +
          '<div>' +
            '<div class="bldg-name">' + esc(b.display_name) + '</div>' +
            (meta ? '<div class="bldg-meta">' + esc(meta) + '</div>' : '') +
          '</div>' +
        '</div>' +
        '<button class="wrong-link" id="s2-wrong" type="button">Wrong building? Search instead</button>'
      ) : '') +
      '<div class="picker ' + (b ? '' : 'on') + '" id="picker">' +
        '<input class="picker-input" id="picker-input" type="text" placeholder="' + (b ? 'Search by name or street…' : 'Which building do you own in?') + '" autocomplete="off">' +
        '<div class="picker-results" id="picker-results"></div>' +
      '</div>' +
      '<button class="btn" id="s2-next" ' + (b ? '' : 'disabled') + '>Yes, this is me →</button>';
    const picker = document.getElementById('picker');
    const input = document.getElementById('picker-input');
    const results = document.getElementById('picker-results');
    const next = document.getElementById('s2-next');
    const wrong = document.getElementById('s2-wrong');
    if (wrong) wrong.onclick = function(){ picker.classList.add('on'); input.focus(); };
    let timer;
    const fetchAndRender = async function() {
      const q = input.value.trim();
      const list = await searchBuildings(q);
      if (!list.length) { results.innerHTML = q ? '<div class="picker-empty">No matches. Try a different search.</div>' : ''; return; }
      results.innerHTML = list.map(function(r){
        const m = [r.neighborhood, r.city_name].filter(Boolean).join(' · ');
        return '<button class="picker-row" data-slug="' + esc(r.slug) + '" type="button">' +
          '<div class="pr-name">' + esc(r.display_name) + '</div>' +
          (m ? '<div class="pr-meta">' + esc(m) + '</div>' : '') +
        '</button>';
      }).join('');
      results.querySelectorAll('.picker-row').forEach(function(btn){
        btn.onclick = function(){
          state.building = list.find(function(r){ return r.slug === btn.dataset.slug; });
          render();
        };
      });
    };
    input.addEventListener('input', function(){ clearTimeout(timer); timer = setTimeout(fetchAndRender, 220); });
    if (picker.classList.contains('on') && !b) fetchAndRender();
    next.onclick = function(){
      if (!state.building) return;
      logEvent('building_selected', { building_slug: state.building.slug });
      goTo(3);
    };
  },

  3: function(card) {
    card.innerHTML =
      '<div class="eyebrow">Your building, right now</div>' +
      '<h1 class="sm">Here\'s where <em>' + esc(state.building.display_name) + '</em> stands</h1>' +
      '<div class="reveal-loading" id="reveal-loading">Pulling your live market data…</div>' +
      '<div id="reveal-content" style="display:none;"></div>' +
      '<button class="btn" id="s3-next" disabled>Keep this updated →</button>';
    const next = document.getElementById('s3-next');
    (async function(){
      if (!state.reportLoaded) { state.report = await fetchReport(state.building.slug); state.reportLoaded = true; }
      document.getElementById('reveal-loading').style.display = 'none';
      const content = document.getElementById('reveal-content');
      content.style.display = 'block';
      next.disabled = false;
      const d = state.report;
      if (!d || !d.tiers || !d.tiers.building) {
        content.innerHTML = '<p class="body" style="text-align:center;">We don\'t have enough recorded sales to publish a building median yet — but your <strong>' + AMOUNT + ' credit</strong> is still reserved.</p>';
        return;
      }
      const t = d.tiers, prem = d.premiums || {};
      const yoyOk = (t.building.n_12mo || 0) >= 4 && t.building.trend_ppsf_pct != null;
      const yoy = t.building.trend_ppsf_pct;
      const buildingName = d.building.name || state.building.display_name;
      let verdict;
      const p = prem.vs_surrounding_pct;
      if (p == null) verdict = esc(buildingName) + ' is one of <b>' + marketName() + '</b>\'s tracked buildings.';
      else {
        const a = Math.abs(p).toFixed(1).replace(/\.0$/,'');
        if (p >= 0.5) verdict = esc(buildingName) + ' is running a <b>+' + a + '% premium</b> to the surrounding blocks.';
        else if (p <= -0.5) verdict = esc(buildingName) + ' is trading at a <b>' + a + '% discount</b> to the surrounding blocks.';
        else verdict = esc(buildingName) + ' is priced <b>in line</b> with the surrounding blocks.';
      }
      const rows = [
        { label: 'Your building', v: t.building.median_ppsf_12mo, self: true },
        { label: 'Surrounding blocks', v: t.surrounding && t.surrounding.median_ppsf_12mo, self: false },
        { label: d.building.neighborhood || 'Neighborhood', v: t.neighborhood && t.neighborhood.median_ppsf_12mo, self: false },
        { label: 'All San Francisco', v: t.sf && t.sf.median_ppsf_12mo, self: false }
      ];
      content.innerHTML =
        '<div class="reveal-big">' +
          '<div class="reveal-ppsf">' + ppsf(t.building.median_ppsf_12mo) + '<span class="unit"> / sqft</span></div>' +
          '<div class="reveal-sub">Median · trailing 12 months</div>' +
          (yoyOk ? '<div class="reveal-yoy ' + (yoy < 0 ? 'down' : '') + '">' + pctStr(yoy) + ' YoY</div>' : '') +
        '</div>' +
        '<div class="reveal-table">' +
          rows.filter(function(r){ return r.v != null; }).map(function(r){
            return '<div class="reveal-row ' + (r.self ? 'self' : '') + '">' +
              '<span class="label">' + esc(r.label) + '</span>' +
              '<span class="value">' + ppsf(r.v) + ' / sqft</span>' +
            '</div>';
          }).join('') +
        '</div>' +
        '<div class="reveal-verdict">' + verdict + '</div>' +
        '<div class="reveal-source">Pulled from public records.</div>';
      logEvent('value_revealed', { building_slug: state.building.slug, ppsf: t.building.median_ppsf_12mo, premium_vs_surrounding: prem.vs_surrounding_pct });
      if (state.email) captureLead('value_revealed');
    })();
    next.onclick = function(){ goTo(4); };
  },

  4: function(card) {
    const bname = (state.building && state.building.display_name) || 'your building';
    card.innerHTML =
      '<div class="eyebrow">What you get</div>' +
      '<h1 class="sm">Here\'s <em>exactly</em> what you\'re signing up for</h1>' +
      '<div style="margin:14px 0 8px;">' +
        '<div class="bullet-row"><div class="bullet-icon">📊</div><div class="bullet-text">Your building\'s <b>live market data</b> — comps, $/sqft, trend, kept current automatically.</div></div>' +
        '<div class="bullet-row"><div class="bullet-icon">💰</div><div class="bullet-text">A <b>' + AMOUNT + ' credit</b> saved to your account — for whenever you sell or buy.</div></div>' +
        '<div class="bullet-row"><div class="bullet-icon">✉️</div><div class="bullet-text"><b>Optional updates</b> — when something noteworthy happens at ' + esc(bname) + '. Switch off anytime.</div></div>' +
      '</div>' +
      '<div class="s4-sub">That\'s the entire product. No upsells, no upgrades.</div>' +
      '<button class="btn" id="s4-next" style="margin-top:18px;">Sounds good — what\'s next? →</button>';
    document.getElementById('s4-next').onclick = function(){ logEvent('product_explained'); goTo(5); };
  },

  5: function(card) {
    const bname = (state.building && state.building.display_name) || 'your building';
    card.innerHTML =
      '<div class="eyebrow">Before we go further</div>' +
      '<h1 class="sm">A <em>promise</em> we put in writing</h1>' +
      '<div class="trust-statement">We will <strong>never</strong> call you. Never text you. Never pass your info to an agent. No phone-call campaigns. No spam.</div>' +
      '<p class="body">We just keep your account\'s market data current. If something noteworthy happens at <strong>' + esc(bname) + '</strong>, you\'ll get an email. You can switch those off anytime, no questions asked.</p>' +
      '<p class="body">Your assigned agent only comes into the picture if and when <strong>you decide to transact</strong> — never before.</p>' +
      '<div class="trust-icons"><span>🔒 No phone required</span><span>🔒 No verification</span><span>🔒 Just an email</span></div>' +
      '<button class="btn" id="s5-next">Got it — save my ' + AMOUNT + ' →</button>';
    document.getElementById('s5-next').onclick = function(){ logEvent('reassurance_viewed'); goTo(6); };
  },

  6: function(card) {
    if (state.emailSent) { renderSent(card); return; }
    card.innerHTML =
      '<div class="eyebrow">One last step</div>' +
      '<h1 class="sm">Your <em>' + AMOUNT + '</em> is one tap away.</h1>' +
      '<p class="body">Enter your email and we\'ll send a one-tap login — no password to create.</p>' +
      '<label class="email-label" for="email-input">Email</label>' +
      '<input id="email-input" class="email-input" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" value="' + esc(state.email || '') + '">' +
      '<div class="email-error" id="email-error">Please enter a valid email address.</div>' +
      '<button class="btn" id="s6-next">Save my ' + AMOUNT + ' →</button>' +
      '<div class="email-fine">Creates your free <strong style="color:var(--text-dim);">' + marketName() + '</strong> account. We never share your email.</div>';
    const input = document.getElementById('email-input');
    const err = document.getElementById('email-error');
    const next = document.getElementById('s6-next');
    if (!state.email) input.focus();
    next.onclick = async function(){
      const email = input.value.trim();
      if (!isEmail(email)) { err.classList.add('on'); return; }
      err.classList.remove('on');
      state.email = email;
      next.disabled = true; next.textContent = 'Sending your link…';
      await captureLead('email_provided');
      logEvent('email_provided', { building_slug: state.building && state.building.slug });
      try {
        const redirectTo = location.origin + '/save-10k/confirm/' + (state.building ? '?b=' + encodeURIComponent(state.building.slug) : '');
        await sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: redirectTo } });
      } catch (e) { console.warn('[otp]', e?.message); }
      state.emailSent = true;
      renderSent(document.getElementById('card'));
    };
  }
};

function renderSent(card) {
  card.innerHTML =
    '<div class="sent-icon">✓</div>' +
    '<h1 class="sm" style="text-align:center;">Check your inbox</h1>' +
    '<p class="body" style="text-align:center;">We just sent your sign-in link to <strong>' + esc(state.email) + '</strong>. Tap it from your phone or laptop to lock in your <strong style="color:var(--gold);">' + AMOUNT + '</strong>.</p>' +
    '<button class="resend" id="resend" type="button">Didn\'t see it? Resend the link</button>' +
    '<div class="email-fine" style="margin-top:24px;">The link expires in 1 hour. Check your spam folder if it doesn\'t arrive in a minute.</div>';
  setTimeout(function(){ const r = document.getElementById('resend'); if (r) r.classList.add('on'); }, 30000);
  document.getElementById('resend').onclick = async function(){
    const btn = document.getElementById('resend');
    btn.textContent = 'Sending…'; btn.disabled = true;
    try {
      const redirectTo = location.origin + '/save-10k/confirm/' + (state.building ? '?b=' + encodeURIComponent(state.building.slug) : '');
      await sb.auth.signInWithOtp({ email: state.email, options: { emailRedirectTo: redirectTo } });
    } catch (e) {}
    btn.textContent = 'Sent again — check your inbox';
  };
  document.getElementById('back').classList.remove('on');
}

/* ------------ global listeners ------------ */
document.getElementById('back').addEventListener('click', function(){ if (state.screen > 1 && !state.emailSent) goTo(state.screen - 1); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && document.activeElement && document.activeElement.tagName !== 'TEXTAREA') {
    const cta = document.querySelector('.card .btn:not([disabled])'); if (cta) cta.click();
  }
});

/* ------------ init (SYNC first, async pre-fill after) -------------------- */
(function init(){
  try {
    getVisitorToken();
    const e = params.get('e');
    if (e) { try { state.email = decodeURIComponent(e); } catch { state.email = e; } }

    // 1) Render Screen 1 immediately so the page is never blank
    render();

    // 2) Fire-and-forget: load the building pre-fill, then re-render Screen 1 if still there
    const b = params.get('b');
    if (b) {
      searchBuildings(b).then(function(res){
        const exact = res.find(function(r){ return r.slug === b; });
        state.building = exact || { slug: b, display_name: b.replace(/-/g,' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); }), neighborhood: '', city_name: '' };
        if (state.screen === 1) render();
      });
    }

    logEvent('form_started', { building_slug: b || null });
  } catch (err) {
    console.error('[init] failed', err);
    showFatal('Init error: ' + (err && err.message || err));
  }
})();
</script>
</body>
</html>
