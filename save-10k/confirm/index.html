<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>$10,000 locked in · San Francisco Condo Market</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1115;--card:#171a20;--border:rgba(232,227,216,0.10);--rule:rgba(232,227,216,0.10);--text:#e8e3d8;--text-dim:rgba(232,227,216,0.75);--text-faint:rgba(232,227,216,0.45);--gold:#d4a574;--green:#8fb97a;--ff-display:'Playfair Display',Georgia,serif;--ff-body:'DM Sans',-apple-system,system-ui,sans-serif;--ff-mono:'JetBrains Mono',ui-monospace,monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--ff-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;}
@media(min-width:900px){body{padding-top:80px;background:radial-gradient(60% 50% at 50% 0%,rgba(212,165,116,0.06),transparent 70%),var(--bg);}}
.stage{width:100%;max-width:480px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px 28px;text-align:center;animation:fadein 280ms ease;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.check{width:64px;height:64px;border-radius:50%;background:rgba(143,185,122,0.12);border:1px solid rgba(143,185,122,0.35);color:var(--green);margin:0 auto 22px;display:flex;align-items:center;justify-content:center;font-size:30px;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;margin:30px auto;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
h1{font-family:var(--ff-display);font-weight:500;font-size:30px;line-height:1.15;margin-bottom:14px;letter-spacing:-0.01em;}
h1.sm{font-size:24px;}
h1 em{font-style:italic;color:var(--gold);}
.lede{font-size:15.5px;color:var(--text-dim);line-height:1.55;margin-bottom:22px;}
.bldg-stat{margin:24px 0;padding:18px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);}
.bldg-stat .nm{font-family:var(--ff-mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;}
.bldg-stat .num{font-family:var(--ff-display);font-style:italic;font-weight:500;font-size:24px;color:var(--gold);line-height:1.1;}
.bldg-stat .meta{font-family:var(--ff-mono);font-size:11px;color:var(--text-dim);margin-top:6px;}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;background:var(--gold);color:#1a1f2e;border:none;border-radius:999px;font-family:var(--ff-body);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;}
.btn:hover{opacity:.9;}
.sec-link{display:block;margin-top:18px;text-align:center;color:var(--text-dim);text-decoration:underline;text-underline-offset:3px;font-size:13.5px;}
.sec-link:hover{color:var(--gold);}
.ftr{margin:24px auto 0;text-align:center;color:var(--text-faint);font-size:11px;font-family:var(--ff-mono);letter-spacing:0.06em;}
</style>
</head>
<body>
<div class="stage">
  <div class="card" id="card">
    <div class="spinner"></div>
    <h1 class="sm">Locking in your <em>$10,000</em>…</h1>
    <p class="lede">One moment — saving the credit to your account.</p>
  </div>
  <div class="ftr">SAN FRANCISCO CONDO MARKET · McMullen Properties · DRE #02016832</div>
</div>

<script type="module">
import { sb } from '/assets/cm-supabase.js';

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const marketSlug = () => location.hostname.includes('siliconvalley') ? 'silicon-valley-condo-market' : 'san-francisco-condo-market';
const marketName = () => marketSlug().startsWith('silicon') ? 'Silicon Valley Condo Market' : 'San Francisco Condo Market';
const ppsf = n => n==null||isNaN(n) ? '—' : '$'+Math.round(Number(n)).toLocaleString('en-US');
const pctStr = n => { if (n==null||isNaN(n)) return ''; const a = Math.abs(n).toFixed(1).replace(/\.0$/,''); return (n>=0?'+':'−')+a+'%'; };

const slug = new URLSearchParams(location.search).get('b');

(async function init() {
  let session = null;
  try { const { data } = await sb.auth.getSession(); session = data?.session || null; } catch {}
  if (!session) {
    await new Promise(resolve => {
      const t = setTimeout(resolve, 4000);
      const { data: sub } = sb.auth.onAuthStateChange((_e, s) => {
        if (s) { session = s; clearTimeout(t); sub?.subscription?.unsubscribe?.(); resolve(); }
      });
    });
  }
  if (!session?.user) return renderError();

  let granted = false;
  try {
    const visitor = localStorage.getItem('cm_visitor_token') || null;
    const { data: g } = await sb.rpc('grant_impossible_offer_credit', {
      p_user_id: session.user.id, p_visitor_token: visitor, p_market_slug: marketSlug()
    });
    granted = !!(g && g.granted);
  } catch (e) { console.warn('[grant]', e?.message); }
  localStorage.setItem('cm_signed_up', '1');

  let report = null;
  if (slug) {
    try { const { data } = await sb.rpc('building_market_report', { p_building_slug: slug, p_radius_mi: 0.5 }); report = data; } catch {}
  }
  try {
    await sb.rpc('log_funnel_event', {
      p_event_type: 'credit_saved',
      p_email: session.user.email || null,
      p_metadata: { amount: 10000, building_slug: slug, market: marketSlug(), granted },
      p_source: 'save-10k'
    });
  } catch {}
  renderSuccess(report);
})();

function renderSuccess(d) {
  const card = document.getElementById('card');
  const stat = (() => {
    if (!d || !d.building) return '';
    const t = d.tiers?.building, prem = d.premiums?.vs_surrounding_pct;
    const yoyOk = (t?.n_12mo || 0) >= 4 && t?.trend_ppsf_pct != null;
    const numParts = [];
    if (t?.median_ppsf_12mo != null) numParts.push(`${ppsf(t.median_ppsf_12mo)}/sqft`);
    if (yoyOk) numParts.push(`${pctStr(t.trend_ppsf_pct)} YoY`);
    const verdict = prem == null ? '' :
      prem >= 0.5  ? `${pctStr(prem)} premium to surrounding blocks` :
      prem <= -0.5 ? `${pctStr(prem)} vs surrounding blocks` :
      'In line with surrounding blocks';
    return `
      <div class="bldg-stat">
        <div class="nm">${esc(d.building.name)} · as of today</div>
        ${numParts.length ? `<div class="num">${numParts.join(' · ')}</div>` : ''}
        ${verdict ? `<div class="meta">${esc(verdict)}</div>` : ''}
      </div>`;
  })();
  card.innerHTML = `
    <div class="check">✓</div>
    <h1>Your <em>$10,000</em> is locked in.</h1>
    <p class="lede">Saved to your ${marketName()} account. Applied at closing on your next deal through Condo Market with your assigned agent.</p>
    ${stat}
    <a class="btn" href="/dashboard/">Go to my dashboard →</a>
    ${slug ? `<a class="sec-link" href="/building/${esc(slug)}/report">See the full report on ${esc(d?.building?.name || 'your building')} →</a>` : ''}
  `;
}
function renderError() {
  document.getElementById('card').innerHTML = `
    <h1 class="sm">Your <em>link</em> may have expired</h1>
    <p class="lede">Magic-link sessions last about an hour. Request a fresh one and we'll lock in your $10,000.</p>
    <a class="btn" href="/save-10k/${slug ? '?b='+encodeURIComponent(slug) : ''}">Get a new link →</a>
  `;
}
</script>
</body>
</html>
