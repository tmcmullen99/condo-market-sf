<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DealMachine CSV Ingest · Condo Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f131d;color:#e8e3d8;font-family:'DM Sans',sans-serif;padding:60px 24px;max-width:720px;margin:0 auto;min-height:100vh;-webkit-font-smoothing:antialiased}
h1{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:36px;font-weight:400;margin:0 0 8px;line-height:1.1}
.gold{color:#d4a574}
.sub{opacity:.6;font-size:14px;margin-bottom:28px;line-height:1.6}
.card{background:#1a1f2e;border:1px solid rgba(232,227,216,.12);border-radius:10px;padding:24px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
input[type=email],input[type=password],input[type=text]{flex:1;min-width:200px;background:#0f131d;color:#e8e3d8;padding:10px 12px;border:1px solid rgba(232,227,216,.2);border-radius:6px;font-family:inherit;font-size:14px}
input[type=file]{background:#0f131d;color:#e8e3d8;padding:12px;border:1px solid rgba(232,227,216,.2);border-radius:6px;width:100%;margin-bottom:12px;font-family:inherit;font-size:14px}
button{background:#d4a574;color:#0f131d;padding:10px 20px;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px}
button.sec{background:transparent;color:rgba(232,227,216,.7);border:1px solid rgba(232,227,216,.2)}
button:hover{opacity:.88}
button:disabled{opacity:.4;cursor:not-allowed}
.status{padding:14px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:12px;white-space:pre-wrap;max-height:340px;overflow:auto;margin-top:16px;line-height:1.6;word-break:break-word}
.status.ok{background:rgba(124,157,106,.12);color:#b8d4a8;border:1px solid rgba(124,157,106,.4)}
.status.err{background:rgba(216,128,128,.12);color:#e8a8a8;border:1px solid rgba(216,128,128,.4)}
.status.info{background:rgba(159,180,216,.08);color:#9fb4d8;border:1px solid rgba(159,180,216,.3)}
.who{font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.7;margin-bottom:14px}
.code{font-family:'JetBrains Mono',monospace;font-size:12px;background:rgba(232,227,216,.05);padding:1px 6px;border-radius:3px}
</style>
</head>
<body>
<h1>DealMachine <span class="gold">CSV Ingest</span></h1>
<p class="sub">Drop in your DealMachine export. Rows land as JSONB in <span class="code">staging_dealmachine_campbell</span>; transformations run server-side next.</p>

<div class="card">
  <div id="auth-section">
    <div id="auth-msg" class="status info">Initializing…</div>
  </div>
  <div id="upload-section" style="display:none">
    <div class="who" id="who"></div>
    <input type="file" id="file" accept=".csv,text/csv" />
    <button id="upload-btn">Parse &amp; insert</button>
    <button class="sec" id="signout-btn">Sign out</button>
    <div id="result"></div>
  </div>
</div>

<script type="module">
const SUPABASE_URL = 'https://kfqphwerygccpzntbbif.supabase.co';
const ANON_KEY_LS = 'cms_admin_anon_key_v1';

let ANON_KEY = localStorage.getItem(ANON_KEY_LS) || '';

function setStatus(el, msg, cls) {
  el.textContent = msg;
  el.className = 'status ' + (cls || 'info');
}

function showKeyPrompt(msg) {
  setStatus(document.getElementById('auth-msg'), msg, 'err');
  const sec = document.getElementById('auth-section');
  const div = document.createElement('div');
  div.style.marginTop = '12px';
  div.innerHTML = '<div class="row"><input type="password" id="key-input" placeholder="Paste anon key (eyJ…)" /><button id="key-save">Save</button></div>';
  sec.appendChild(div);
  document.getElementById('key-save').onclick = () => {
    const k = document.getElementById('key-input').value.trim();
    if (k.startsWith('eyJ') && k.length > 100) {
      localStorage.setItem(ANON_KEY_LS, k);
      location.reload();
    } else {
      setStatus(document.getElementById('auth-msg'), "That doesn't look like a Supabase anon key.", 'err');
    }
  };
}

if (!ANON_KEY || !ANON_KEY.startsWith('eyJ') || ANON_KEY.length < 100) {
  showKeyPrompt('No Supabase anon key in localStorage. Paste it from your Supabase API settings page below.');
} else {
  try {
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
    const sb = createClient(SUPABASE_URL, ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });

    const { data: { session }, error: sErr } = await sb.auth.getSession();
    if (sErr) {
      showKeyPrompt('Auth error: ' + sErr.message);
    } else if (!session) {
      const am = document.getElementById('auth-msg');
      setStatus(am, 'Not signed in.', 'err');
      const div = document.createElement('div');
      div.style.marginTop = '12px';
      div.innerHTML = '<div class="row"><input type="email" id="email" placeholder="email" value="tim@mcmullen.properties" /><input type="password" id="password" placeholder="password" /><button id="signin-btn">Sign in</button></div>';
      document.getElementById('auth-section').appendChild(div);
      document.getElementById('signin-btn').onclick = async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          setStatus(am, 'Sign-in failed: ' + error.message, 'err');
        } else {
          location.reload();
        }
      };
    } else {
      document.getElementById('auth-section').style.display = 'none';
      document.getElementById('upload-section').style.display = 'block';
      document.getElementById('who').textContent = 'signed in as ' + session.user.email;

      document.getElementById('signout-btn').onclick = async () => {
        await sb.auth.signOut();
        location.reload();
      };

      document.getElementById('upload-btn').onclick = async () => {
        const fileEl = document.getElementById('file');
        const result = document.getElementById('result');
        const btn = document.getElementById('upload-btn');
        const file = fileEl.files[0];
        if (!file) {
          setStatus(result, 'Pick a file first.', 'err');
          return;
        }

        btn.disabled = true;
        try {
          setStatus(result, 'Reading file…', 'info');
          const text = await file.text();

          // RFC-4180-ish CSV parser: handles quoted fields, embedded commas, escaped quotes, CRLF
          function parseCSV(csv) {
            const rows = [];
            let row = [];
            let field = '';
            let inQuotes = false;
            let fieldStart = true;
            for (let i = 0; i < csv.length; i++) {
              const ch = csv[i];
              if (inQuotes) {
                if (ch === '"' && csv[i+1] === '"') { field += '"'; i++; }
                else if (ch === '"') { inQuotes = false; }
                else field += ch;
              } else {
                if (ch === '"' && fieldStart) { inQuotes = true; fieldStart = false; }
                else if (ch === ',') { row.push(field); field = ''; fieldStart = true; }
                else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; fieldStart = true; }
                else if (ch === '\r') { /* skip */ }
                else { field += ch; fieldStart = false; }
              }
            }
            if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
            return rows;
          }

          setStatus(result, 'Parsing CSV…', 'info');
          const rows = parseCSV(text);
          if (rows.length < 2) throw new Error('CSV has fewer than 2 rows');
          const headers = rows[0];
          const dataRows = rows.slice(1).filter(r => r.length === headers.length && r.some(c => c !== ''));

          setStatus(result, 'Parsed ' + dataRows.length + ' rows × ' + headers.length + ' columns.\nWiping any prior staging rows…', 'info');
          const { error: delErr } = await sb.from('staging_dealmachine_campbell').delete().neq('id', 0);
          if (delErr) throw new Error('Could not wipe prior staging: ' + delErr.message);

          const records = dataRows.map(r => {
            const obj = {};
            headers.forEach((h, i) => { obj[h] = r[i] === '' ? null : r[i]; });
            return { row_data: obj, source_filename: file.name };
          });

          const batchSize = 100;
          let inserted = 0;
          for (let i = 0; i < records.length; i += batchSize) {
            const batch = records.slice(i, i + batchSize);
            const { error } = await sb.from('staging_dealmachine_campbell').insert(batch);
            if (error) throw new Error('Batch ' + Math.floor(i/batchSize + 1) + ': ' + error.message + ' (inserted ' + inserted + ' so far)');
            inserted += batch.length;
            setStatus(result, 'Inserted ' + inserted + ' / ' + records.length + ' rows…', 'info');
          }

          setStatus(
            result,
            '✓ Done.\n\nFile: ' + file.name + '\nRows inserted: ' + inserted + '\nColumns: ' + headers.length + '\n\nColumn names:\n' + headers.join(', ') + '\n\nReply to Claude with "done" and the transformations run next.',
            'ok'
          );
        } catch (e) {
          setStatus(result, '✗ ' + (e.message || String(e)), 'err');
        } finally {
          btn.disabled = false;
        }
      };
    }
  } catch (e) {
    showKeyPrompt('Module load failed: ' + (e.message || String(e)));
  }
}
</script>
</body>
</html>
