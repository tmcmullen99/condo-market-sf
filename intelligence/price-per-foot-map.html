<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$/Foot Map — Condo Market Intelligence</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#f4f5f8; --card:#ffffff; --card-lift:#eef1f6;
    --ivory:#1f2430; --ivory-dim:rgba(31,36,48,.62); --ivory-faint:rgba(31,36,48,.42);
    --bronze:#9c6b2e; --peri:#5f77b4; --gain:#4f7a39; --rust:#b8472f;
    --rule:rgba(31,36,48,.10); --rule-soft:rgba(31,36,48,.06);
    --ff-display:'Playfair Display',Georgia,serif;
    --ff-mono:'JetBrains Mono',ui-monospace,monospace;
    --ff-body:'DM Sans',-apple-system,Segoe UI,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--navy);color:var(--ivory);font-family:var(--ff-body);line-height:1.5;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(1200px 600px at 80% -10%, rgba(159,180,216,.06), transparent 60%),
                     radial-gradient(900px 500px at 0% 110%, rgba(212,165,116,.05), transparent 55%);
    background-attachment:fixed;}
  .wrap{max-width:1240px;margin:0 auto;padding:34px 26px 40px}
  .eyebrow{font-family:var(--ff-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--bronze);margin-bottom:10px}
  h1{font-family:var(--ff-display);font-weight:600;font-size:clamp(30px,4.2vw,46px);line-height:1.04;letter-spacing:-.01em}
  h1 em{font-style:italic;color:var(--peri);font-weight:500}
  .sub{color:var(--ivory-dim);font-size:15px;margin-top:10px;max-width:64ch}
  .live{display:inline-flex;align-items:center;gap:7px;font-family:var(--ff-mono);font-size:11px;letter-spacing:.1em;color:var(--ivory-faint);margin-top:14px;text-transform:uppercase}
  .live .dot{width:7px;height:7px;border-radius:50%;background:var(--gain);box-shadow:0 0 0 0 rgba(132,217,160,.5);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(132,217,160,.45)}70%{box-shadow:0 0 0 7px rgba(132,217,160,0)}100%{box-shadow:0 0 0 0 rgba(132,217,160,0)}}

  .hm-toolbar{display:inline-flex;gap:4px;margin-top:26px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:4px}
  .hm-toolbar button{font-family:var(--ff-body);font-size:13px;font-weight:500;color:var(--ivory-dim);background:transparent;border:none;cursor:pointer;padding:9px 16px;border-radius:9px;transition:.14s}
  .hm-toolbar button.on{background:var(--ivory);color:#fff}
  .hm-toolbar button:not(.on):hover{background:var(--card-lift);color:var(--ivory)}

  .hm-map-wrap{margin-top:18px;border:1px solid var(--rule);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(31,36,48,.04),0 10px 30px rgba(31,36,48,.06)}
  #heatmap{height:560px;width:100%;background:#e9edf3}
  @media (max-width:760px){#heatmap{height:440px}}

  .hm-legend{display:flex;align-items:center;gap:12px;margin-top:16px;font-family:var(--ff-mono);font-size:11px;color:var(--ivory-dim);letter-spacing:.04em}
  .hm-grad{flex:1;max-width:280px;height:8px;border-radius:99px;background:linear-gradient(90deg,#9fb4d8 0%,#d4a574 50%,#c95742 100%)}

  .leaflet-popup-content{font-family:var(--ff-body);font-size:13px;color:var(--ivory);margin:12px 14px}
  .leaflet-popup-content strong{font-family:var(--ff-display);font-style:italic;font-size:15px}
  .leaflet-popup-content .pop-stat{font-family:var(--ff-mono);font-size:11.5px;color:var(--ivory-dim);margin-top:4px}
  .leaflet-popup-content .pop-link{display:inline-block;margin-top:8px;font-family:var(--ff-mono);font-size:11px;letter-spacing:.04em;color:var(--peri);text-transform:uppercase}
  .hm-msg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ivory-faint);font-style:italic;font-family:var(--ff-display);font-size:17px}

  /* rich popup card */
  .leaflet-popup-content-wrapper{border-radius:14px;overflow:hidden;padding:0;box-shadow:0 8px 30px rgba(31,36,48,.18)}
  .leaflet-popup-content{margin:0 !important;width:248px !important}
  .pop-card{display:block;color:var(--ivory);text-decoration:none}
  .pop-card .pop-img{width:100%;height:130px;object-fit:cover;display:block;background:var(--card-lift)}
  .pop-card .pop-noimg{width:100%;height:130px;display:flex;align-items:center;justify-content:center;background:var(--card-lift);color:var(--ivory-faint);font-family:var(--ff-display);font-style:italic;font-size:14px}
  .pop-body{padding:12px 14px 14px}
  .pop-name{font-family:var(--ff-display);font-style:italic;font-weight:600;font-size:16px;line-height:1.15;color:var(--ivory)}
  .pop-addr{font-family:var(--ff-mono);font-size:11px;color:var(--ivory-dim);margin-top:5px;line-height:1.35}
  .pop-row{display:flex;gap:14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
  .pop-metric{flex:1}
  .pop-metric .k{font-family:var(--ff-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ivory-faint)}
  .pop-metric .v{font-family:var(--ff-display);font-size:17px;font-weight:600;color:var(--ivory);margin-top:2px}
  .pop-cta{display:block;margin-top:12px;text-align:center;font-family:var(--ff-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--ivory);padding:9px;border-radius:8px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Condo Market · Intelligence</div>
  <h1>$/foot <em>map</em></h1>
  <p class="sub">Every catalogued building, placed and shaded by the metric you choose — trailing price per foot, sales velocity, or dollar volume. Larger dots = more recent closings. Click any building for its detail.</p>
  <div class="live"><span class="dot"></span> <span id="live-line">Live</span></div>

  <div class="hm-toolbar" id="heatmap-toggle">
    <button class="on" data-metric="psf">Price / foot</button>
    <button data-metric="velocity">Sales velocity</button>
    <button data-metric="volume">Dollar volume</button>
  </div>

  <div class="hm-map-wrap"><div id="heatmap"><div class="hm-msg">Loading map…</div></div></div>

  <div class="hm-legend"><span id="legend-low">—</span><span class="hm-grad"></span><span id="legend-high">—</span></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(function () {
  'use strict';
  // Market comes from the ?m= param the parent intelligence page passes into the iframe.
  var MARKET = new URLSearchParams(location.search).get('m') || 'san-francisco-condo-market';
  var SUPABASE_URL  = 'https://kfqphwerygccpzntbbif.supabase.co';
  var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmcXBod2VyeWdjY3B6bnRiYmlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzOTgxODQsImV4cCI6MjA5MTk3NDE4NH0.FGQD3BMLVLD9lE8LUBUjD3SqKhsCxjdnCiGV8MMnqpg';

  function rpc(name, body) {
    return fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
      body: JSON.stringify(body || {})
    }).then(function (r) { if (!r.ok) throw new Error('rpc ' + name + ' ' + r.status); return r.json(); });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nf(n) { return Number(n).toLocaleString('en-US'); }
  function moneyShort(n) { if (n == null || isNaN(n)) return '—'; n = Number(n); if (n >= 1e9) return '$' + (n / 1e9).toFixed(1) + 'B'; if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M'; if (n >= 1e3) return '$' + Math.round(n / 1e3) + 'K'; return '$' + n; }
  function fullDate(d) { if (!d) return '—'; var dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }

  function lerp(a, b, t) { return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')'; }
  function colorFor(v, min, max) {
    if (v == null || max <= min) return '#9fb4d8';
    var t = Math.max(0, Math.min(1, (v - min) / (max - min)));
    return t < 0.5 ? lerp([0x9f, 0xb4, 0xd8], [0xd4, 0xa5, 0x74], t * 2) : lerp([0xd4, 0xa5, 0x74], [0xc9, 0x57, 0x42], (t - 0.5) * 2);
  }

  var map = null, markers = [], buildings = [], cardBySlug = {}, metric = 'psf';

  function valueFor(card) {
    if (!card) return null;
    if (metric === 'psf') return card.median_psf_36mo;
    if (metric === 'velocity') return card.sales_36mo;
    return (card.most_recent_sale_price || 0) * (card.sales_36mo || 0); // rough dollar volume
  }

  function draw() {
    if (!map) return;
    markers.forEach(function (m) { map.removeLayer(m); });
    markers = [];

    // Compute metric range only over buildings that HAVE a value, for the color scale + legend.
    var vals = [];
    buildings.forEach(function (b) { var v = valueFor(cardBySlug[b.slug]); if (v != null) vals.push(v); });
    var min = vals.length ? Math.min.apply(null, vals) : 0;
    var max = vals.length ? Math.max.apply(null, vals) : 0;

    var low = document.getElementById('legend-low'), high = document.getElementById('legend-high');
    if (vals.length) {
      if (metric === 'psf') { low.textContent = '$' + nf(Math.round(min)) + '/sf'; high.textContent = '$' + nf(Math.round(max)) + '/sf'; }
      else if (metric === 'velocity') { low.textContent = Math.round(min) + ' sales'; high.textContent = Math.round(max) + ' sales'; }
      else { low.textContent = moneyShort(min); high.textContent = moneyShort(max); }
    } else { low.textContent = '—'; high.textContent = '—'; }

    // Draw a pin for EVERY building with coordinates. Buildings with sales data are
    // sized + colored by the chosen metric; buildings without are shown as small
    // neutral dots so the full catalogue is visible and clickable.
    buildings.forEach(function (b) {
      if (b.lat == null || b.lng == null) return;
      var card = cardBySlug[b.slug];
      var v = card ? valueFor(card) : null;
      var sales = card ? (card.sales_36mo || 0) : 0;
      var hasData = v != null;

      var marker = L.circleMarker([b.lat, b.lng], {
        radius: hasData ? (6 + Math.sqrt(sales) * 0.9) : 5,
        fillColor: hasData ? colorFor(v, min, max) : '#c3cad6',
        color: '#f6f2ea',
        weight: 1,
        opacity: 1,
        fillOpacity: hasData ? 0.85 : 0.55
      }).addTo(map);

      // Rich clickable card: image, name (or address if unnamed), address, units, avg $/foot.
      var title = (b.name && String(b.name).trim()) ? b.name : (b.address || 'Building');
      var psfVal = (card && card.median_psf_36mo) ? card.median_psf_36mo : (b.psf || null);
      var psfDisplay = psfVal ? '$' + nf(Math.round(psfVal)) : '—';
      var unitsDisplay = b.units ? nf(b.units) : '—';
      var img = b.hero_image_url
        ? '<img class="pop-img" src="' + esc(b.hero_image_url) + '" alt="' + esc(title) + '" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;pop-noimg&quot;>No photo yet</div>\'">'
        : '<div class="pop-noimg">No photo yet</div>';

      var html =
        '<div class="pop-card">' +
          img +
          '<div class="pop-body">' +
            '<div class="pop-name">' + esc(title) + '</div>' +
            '<div class="pop-addr">' + esc(b.address || b.hood || '') + '</div>' +
            '<div class="pop-row">' +
              '<div class="pop-metric"><div class="k">Units</div><div class="v">' + unitsDisplay + '</div></div>' +
              '<div class="pop-metric"><div class="k">Avg $/foot</div><div class="v">' + psfDisplay + (psfVal ? '<span style="font-size:11px;font-weight:500"> /sf</span>' : '') + '</div></div>' +
            '</div>' +
            '<a class="pop-cta" href="/building/' + esc(b.slug) + '/" target="_top">View building →</a>' +
          '</div>' +
        '</div>';

      marker.bindPopup(html, { maxWidth: 260, minWidth: 248, closeButton: true });
      markers.push(marker);
    });
  }

  document.querySelectorAll('#heatmap-toggle button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('#heatmap-toggle button').forEach(function (b) { b.classList.remove('on'); });
      btn.classList.add('on'); metric = btn.getAttribute('data-metric'); draw();
    });
  });

  // The parent dispatches a resize on this iframe when its tab is shown — redraw the map then.
  window.addEventListener('resize', function () { if (map) map.invalidateSize(); });

  Promise.all([
    rpc('home_page_payload', { p_market_slug: MARKET }),
    rpc('homepage_building_cards', { p_market_slug: MARKET })
  ]).then(function (res) {
    var payload = res[0] || {}, cards = res[1] || [];
    var idx = payload.index || [];
    buildings = idx.filter(function (b) { return b.lat != null && b.lng != null; }).map(function (b) {
      return { name: b.name, hood: b.neighborhood, lat: b.lat, lng: b.lng, slug: b.slug, units: b.units, year: b.year_built, address: b.address, psf: b.psf, hero_image_url: b.hero_image_url };
    });
    cards.forEach(function (c) { cardBySlug[c.building_slug] = c; });

    var host = document.getElementById('heatmap'); host.innerHTML = '';
    if (!buildings.length) { host.innerHTML = '<div class="hm-msg">No mapped buildings for this market.</div>'; return; }

    var lats = buildings.map(function (b) { return b.lat; }), lngs = buildings.map(function (b) { return b.lng; });
    map = L.map('heatmap', { zoomControl: true, scrollWheelZoom: false, attributionControl: true });
    map.fitBounds([[Math.min.apply(null, lats), Math.min.apply(null, lngs)], [Math.max.apply(null, lats), Math.max.apply(null, lngs)]], { padding: [28, 28] });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', { subdomains: 'abcd', maxZoom: 19, attribution: '© OpenStreetMap, © CARTO' }).addTo(map);

    var st = payload.stats || {}, mk = payload.market || {};
    var ll = document.getElementById('live-line');
    if (ll) ll.textContent = 'Live · ' + (st.buildings != null ? nf(st.buildings) : buildings.length) + ' catalogued buildings · ' + (mk.region || 'San Francisco');

    draw();
    setTimeout(function () { map.invalidateSize(); }, 120);
  }).catch(function (err) {
    console.warn('heatmap load failed', err);
    var host = document.getElementById('heatmap'); if (host) host.innerHTML = '<div class="hm-msg">Map could not load.</div>';
  });
})();
</script>
</body>
</html>
